name: Daily Tip Check

on:
  schedule:
    - cron: '0 7 * * *'  # 16:00 JST
  workflow_dispatch:     # Allows manual triggering

jobs:
  check-tip:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo     # so "today" below is the JST date, not UTC
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check tips.yaml for today's tip
        id: check
        run: |
          python - <<'EOF'
          import datetime
          import os
          import sys
          from random_tip import load_tips

          today = datetime.date.today().isoformat()
          found = any(str(entry.get("date")) == today and entry.get("tip") for entry in load_tips("tips.yaml"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tip_found={str(found).lower()}\n")
          print(f"{'Tip' if found else 'No tip'} dated {today}", file=sys.stderr)
          EOF

      - name: Send mail
        if: steps.check.outputs.tip_found == 'false'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: mail.davetang.org
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "No Tip Submitted Today"
          to: me@davetang.org
          from: "Daily Tip Reminder <me@davetang.org>"
          body: "tips.yaml has no tip dated today. Time to add your tip!"

  test-email:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send Test Email
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: mail.davetang.org
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Email sent from daily_tips"
          to: me@davetang.org
          from: "Daily Tip Reminder <me@davetang.org>"
          body: "Test email from GitHub Action."
