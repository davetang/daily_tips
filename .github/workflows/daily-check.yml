name: Daily Tip Check

on:
  schedule:
    # 11:17 JST. GitHub starts scheduled runs 4-10 h late on this repo, so this
    # lands around 16:00-21:00 JST; off the hour because :00 is the busiest slot.
    - cron: '17 2 * * *'
  workflow_dispatch:     # Allows manual triggering

jobs:
  check-tip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check tips.yaml for the day's tip
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}  # the cron line; empty for manual runs
        run: |
          python - <<'EOF'
          import datetime
          import os
          import sys
          from zoneinfo import ZoneInfo
          from random_tip import load_tips

          # A late run can start after midnight JST, so check the JST date of the
          # scheduled time (the latest one at or before now), not of the start time.
          now = datetime.datetime.now(datetime.timezone.utc)
          when = now
          if os.environ["SCHEDULE"]:
              minute, hour = map(int, os.environ["SCHEDULE"].split()[:2])
              when = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
              if when > now:
                  when -= datetime.timedelta(days=1)
          day = when.astimezone(ZoneInfo("Asia/Tokyo")).date().isoformat()

          found = any(str(entry.get("date")) == day and entry.get("tip") for entry in load_tips("tips.yaml"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tip_found={str(found).lower()}\nday={day}\n")
          print(f"{'Tip' if found else 'No tip'} dated {day}", file=sys.stderr)
          EOF

      - name: Send mail
        if: steps.check.outputs.tip_found == 'false'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: mail.davetang.org
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "No tip for ${{ steps.check.outputs.day }}"
          to: me@davetang.org
          from: "Daily Tip Reminder <me@davetang.org>"
          body: "tips.yaml has no tip dated ${{ steps.check.outputs.day }}. Time to add your tip!"

  test-email:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send Test Email
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: mail.davetang.org
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Email sent from daily_tips"
          to: me@davetang.org
          from: "Daily Tip Reminder <me@davetang.org>"
          body: "Test email from GitHub Action."
