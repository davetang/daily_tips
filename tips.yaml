  explanation: 'Use `ssh -o "ConnectTimeout 10"` to stop SSH trying to connect after 10 seconds.'
  tags: [shell, ssh]
- date: 2026-02-05
  tip: '`make.names(c("123", "1)3"))`'
  explanation: '`make.names()` is a function in base R that can make syntactically valid names out of character vectors.'
  tags: [rstats]
- date: 2026-02-06
  tip: '`sudo apt install apache2-utils`'
  explanation: '`apache2-utils` installs a collection of utility programs for Apache, including `htpasswd` for managing password files for basic authentication.'
  tags: [linux, sysadmin]
- date: 2026-02-07
  tip: "In Singularity, [persistent overlays](https://docs.sylabs.io/guides/latest/user-guide/persistent_overlays.html) allow you to overlay a writable file system on an immutable read-only container for the illusion of read-write access."
  explanation: 'A persistent overlay in Singularity is a directory or file system image that “sits on top” of your immutable SIF container.'
  tags: [singularity]
- date: 2026-02-08
  tip: '`sudo journalctl -xe`'
  explanation: '`sudo journalctl -xe` is a quick way to see the latest log messages with as much context as the system can provide; very useful as a first step when something just broke.'
  tags: [linux, sysadmin]
- date: 2026-02-09
  tip: '`pheatmap::pheatmap(my_mat, breaks=seq(-2, 2, length.out=101))`.'
  explanation: 'With {pheatmap}, when breaks do not cover the range of values, then any value higher or lower will just get the highest or lowest colour.'
  tags: [rstats]
- date: 2026-02-10
  tip: 'Make a new SSH key with `ssh-keygen -t ed25519 -C "laptop"` rather than an RSA key.'
  explanation: 'Ed25519 keys are short and fast, and there is no key size to choose; OpenSSH has made them the default since version 9.5, so plain `ssh-keygen` gives you one too. `-C` sets the comment at the end of the `.pub` line, which tells you which machine a key in `authorized_keys` belongs to.'
  tags: [linux, ssh]
- date: 2026-02-11
  tip: 'Use the [Quarto clean theme](https://github.com/grantmcdermott/quarto-revealjs-clean) for a minimalist and elegant presentation theme.'
  explanation: 'The clean theme provides an elegant and academic-friendly design, which looks very nice.'
  tags: [quarto]
- date: 2026-02-12
  tip: '`gosu` is a tool specifically designed for Docker containers to cleanly switch from root to another user and execute a command.'
  explanation: '`gosu` is the standard, recommended way to drop privileges in Docker entrypoint scripts.'
  tags: [docker]
- date: 2026-02-13
  tip: "If you're using Docker and user permissions are acting strange, check whether you are using rootless mode!"
  explanation: 'Use `docker info` and under Security Options you will see "rootless" if you are using rootless mode!'
  tags: [docker]
- date: 2026-02-14
  tip: 'Use `docker volume` to keep data even after you stop a container.'
  explanation: 'Containers are ephemeral but volumes are not; use `docker volume create mydata`, then mount it with `-v mydata:/data` to keep data safe across container rebuilds and restarts.'
  tags: [docker]
- date: 2026-02-15
  tip: 'Use multi-stage builds to keep Docker images small.'
  explanation: 'Compile or build in one stage, then `COPY --from=builder` only the final artifacts into a minimal runtime image; this avoids shipping compilers, build tools, and intermediate files.'
  tags: [docker, best-practice]
- date: 2026-02-16
  tip: 'Use `define`/`endef` in GNU Make to create canned recipes for reusable command sequences.'
  explanation: 'Canned recipes let you define a sequence of commands once with `define run-tests ... endef` and reuse it across multiple rules with `$(run-tests)`, keeping your Makefile DRY.'
  tags: [make]
- date: 2026-02-17
  tip: '`docker system df`'
  explanation: 'Use `docker system df` to show Docker disk usage broken down by images, containers, volumes, and build cache; use `-v` for detailed output.'
  tags: [docker]
- date: 2026-02-18
  tip: '`sudo dmesg -T --level=err,warn`'
  explanation: 'Use `dmesg -T` for human-readable timestamps and `--level` to filter by severity; great for quickly spotting hardware or driver issues.'
  tags: [linux, sysadmin]
- date: 2026-02-19
  tip: 'In `nvme smart-log` output, `percentage_used`, `available_spare` and `media_errors` tell you whether an NVMe drive is wearing out.'
  explanation: '`percentage_used` is the drive''s estimate of how much of its rated write endurance is gone, and it can go past 100%. `available_spare` is the spare capacity left; the drive raises a warning when it drops below `available_spare_threshold`. `media_errors` counts unrecovered data errors and should stay at 0. A non-zero `critical_warning` means the drive has flagged a problem itself.'
  tags: [linux, sysadmin]
- date: 2026-02-20
  tip: '`pdftotext file.pdf file.txt`'
  explanation: 'Extracts text from a PDF and saves it to a plain text file. Install via `sudo apt install poppler-utils` on Debian/Ubuntu.'
  tags: [linux]
- date: 2026-02-21
  tip: '`flock -n /tmp/myjob.lock ./myjob.sh`'
  explanation: 'Runs `myjob.sh` only if no other instance is running; `-n` exits immediately if the lock is already held rather than waiting. The lock is kernel-level, not file-existence-based, so it is released automatically when the process ends, so no cleanup is needed.'
  tags: [linux, shell, scripting]
- date: 2026-02-22
  tip: '`sudo unshare --net ./my_tool`'
  explanation: 'Runs `my_tool` in an isolated network namespace with no interfaces, routes, or connectivity, which is useful for testing whether a tool works without network access. The namespace is kernel-level and disappears automatically when the process exits.'
  tags: [linux, networking]
- date: 2026-02-23
  tip: '`pgrep -la pattern`'
  explanation: 'List all running processes matching a name pattern, with their PIDs and full command lines. `pkill pattern` kills them all. Much friendlier than `ps aux | grep ...`.'
  tags: [linux, shell]
- date: 2026-02-24
  tip: '`log(x=4, base=2)`'
  explanation: 'In R, instead of using `log2` or `log10` use `log(base=2)` or `log(base=10)` because that way you can generalise to any base!'
  tags: [rstats]
- date: 2026-02-25
  tip: 'Use `dplyr::row_number()` to rank by a column.'
  explanation: '`dplyr::row_number()` accepts a column argument and ranks directly; as noted in the documentation, by default, the smallest values will get the smallest ranks.'
  tags: [rstats, dplyr]
- date: 2026-02-26
  tip: 'Use `dplyr::coalesce()` to find the first non-missing value across columns.'
  explanation: '`dplyr::coalesce(x, y, z)` returns the first non-`NA` value for each element, checking `x` first, then `y`, then `z`; great for consolidating multiple imperfect columns into one.'
  tags: [rstats, dplyr]
- date: 2026-02-27
  tip: '`find . -name "*.log" -o -name "*.tmp"`'
  explanation: 'The `-o` flag is the OR operator in `find`; use it to match multiple patterns in a single command.'
  tags: [shell]
- date: 2026-02-28
  tip: 'Use `dplyr::add_count(df, dplyr::across(everything())) |> dplyr::filter(n > 1)` to find duplicate rows.'
  explanation: '`dplyr::add_count()` appends an `n` column counting identical rows without collapsing the data; `dplyr::across(everything())` groups by all columns so only true duplicates get `n > 1`.'
  tags: [rstats, dplyr]
- date: 2026-03-01
  tip: 'Use `dplyr::case_when()` for vectorised if-else logic.'
  explanation: '`dplyr::case_when(x > 10 ~ "high", x > 5 ~ "medium", .default = "low")` evaluates conditions in order and returns the corresponding value; the `.default` argument handles all unmatched cases.'
  tags: [rstats, dplyr]
- date: 2026-03-02
  tip: 'Use `dplyr::anti_join()` to filter out a blocklist.'
  explanation: '`dplyr::anti_join(users, banned, by = "user_id")` removes every banned user in one readable step, without needing `%in%` or a manual `filter(!id %in% other$id)`.'
  tags: [rstats, dplyr]
- date: 2026-03-03
  tip: 'Prefer `dplyr::if_else(x > 0, "positive", "non-positive")` over base `ifelse()`.'
  explanation: '`dplyr::if_else()` enforces that the `true` and `false` values are the same type, catching subtle bugs; it also handles `NA` explicitly via the `missing` argument.'
  tags: [rstats, dplyr]
- date: 2026-03-04
  tip: '`zgrep "ERROR" app.log.gz`'
  explanation: 'Searches inside a gzipped file without decompressing it first. The whole `z*` family works the same way: `zcat`, `zless`, `zdiff`, and `zegrep` all accept `.gz` files directly.'
  tags: [shell, linux]
- date: 2026-03-05
  tip: 'End `find -exec` with `+` instead of `\;` to run the command once on many files rather than once per file.'
  explanation: '`find . -name "*.log" -exec gzip {} \;` starts a separate `gzip` for every file, while `-exec gzip {} +` passes as many file names as fit on one command line, like `xargs`. With `+`, the `{}` must come last, just before the `+`.'
  tags: [shell]
- date: 2026-03-06
  tip: 'Use `systemctl --user enable --now myservice.service` to run your own services without root.'
  explanation: 'Place a unit file in `~/.config/systemd/user/` and `systemctl --user` manages it entirely in your own session, with no sudo needed. Use `systemctl --user status` to inspect all your personal services.'
  tags: [shell, linux, systemd]
- date: 2026-03-07
  tip: 'Use `disown %1` to detach a background job so it survives logout.'
  explanation: 'After running `cmd &`, use `jobs` to see job numbers, then `disown %1` removes job 1 from the shell''s job table. Unlike `nohup`, it works on already-running jobs you forgot to protect.'
  tags: [shell, linux]
- date: 2026-03-08
  tip: 'Use `dplyr::na_if(x, "")` to convert a sentinel value to `NA`.'
  explanation: '`dplyr::na_if(x, -999)` or `dplyr::na_if(x, "")` replaces a known placeholder with a proper `NA` in one step, avoiding a verbose `mutate(x = ifelse(x == "", NA, x))`.'
  tags: [rstats, dplyr]
- date: 2026-03-09
  tip: '`swapon --show` displays all active swap spaces and their usage.'
  explanation: 'The output columns are: `NAME` (device or file path), `TYPE` (partition or file), `SIZE` (total swap space), `USED` (currently occupied), and `PRIO` (priority: higher values are used first; areas of equal priority are used round-robin).'
  tags: [shell, linux, sysadmin]
- date: 2026-03-10
  tip: 'Use `Ctrl-a M` in GNU screen to monitor a background window for activity.'
  explanation: 'Screen highlights the window and alerts you when new output appears, so you can work elsewhere without constantly switching to check on a running job. Press `Ctrl-a M` again in the same window to toggle monitoring off.'
  tags: [screen]
- date: 2026-03-11
  tip: '`all(x %% 1 == 0)`'
  explanation: 'In R, `is.integer()` will return `FALSE` even if you have all integers but stored in class numeric; use `all(x %% 1 == 0)`.'
  tags: [rstats]
- date: 2026-03-12
  tip: 'Use `sudo journalctl -k --grep="oom_reaper"` to find kernel OOM kill events.'
  explanation: '`journalctl -k` reads kernel messages from the persistent systemd journal and `--grep` filters entries by a regex pattern applied to the message field.'
  tags: [shell, linux, sysadmin]
- date: 2026-03-13
  tip: 'Use `.groups = "drop"` in `dplyr::summarise()` to avoid silently retaining grouping.'
  explanation: 'After `group_by() |> summarise()`, the result remains grouped by all but the last grouping variable; passing `.groups = "drop"` makes the output a plain data frame and prevents subtle bugs in downstream operations.'
  tags: [rstats, dplyr]
- date: 2026-03-14
  tip: 'Prefer `dplyr::bind_rows()` over `rbind()` for stacking data frames.'
  explanation: '`bind_rows()` matches columns by name rather than position, and fills any missing columns with `NA` instead of erroring; it also accepts a list of data frames and an `.id` argument to record which source each row came from.'
  tags: [rstats, dplyr]
- date: 2026-03-15
  tip: 'Use `dplyr::consecutive_id()` to label consecutive runs of identical values.'
  explanation: '`dplyr::mutate(df, run = dplyr::consecutive_id(x))` increments the ID each time `x` differs from the previous row.'
  tags: [rstats, dplyr]
- date: 2026-03-16
  tip: 'Use `readr::cols_only()` to read a subset of columns from a CSV.'
  explanation: '`readr::read_csv(f, col_types = cols_only(id = col_character(), value = col_double()))` reads only the columns named in `cols_only()`; they must exist in the CSV header or you get an error. Everything else is silently dropped.'
  tags: [rstats, tidyverse]
- date: 2026-03-17
  tip: 'Use `readr::read_csv(f, name_repair = "universal")` to auto-fix messy column names.'
  explanation: 'The `"universal"` strategy applies `vctrs::vec_as_names()` with `repair = "universal"`, which replaces spaces and special characters with `.`, prepends a `.` to names that start with a number (so `2x` becomes `.2x`), and uses the `...N` form for empty or duplicated names. This guarantees every column name is unique, syntactically valid, and usable without backticks.'
  tags: [rstats, tidyverse]
- date: 2026-03-18
  tip: 'Use `ssh-keygen -R hostname` to remove a stale host key from `known_hosts`.'
  explanation: 'When a SSH key changes, SSH refuses to connect with a scary "host key verification failed" warning. `ssh-keygen -R hostname` deletes only that host''s entry from `~/.ssh/known_hosts`.'
  tags: [shell, linux, ssh]
- date: 2026-03-19
  tip: 'Use `git add -u` to stage only modified and deleted files, skipping untracked files.'
  explanation: 'Unlike `git add -A` or `git add .`, which stage everything including new untracked files, `git add -u` restricts staging to files already tracked by Git. This is useful when you have scratch files, logs, or experiments in your working tree that you do not want to accidentally commit.'
  tags: [git]
- date: 2026-03-20
  tip: 'Use `git restore --source=origin/main -- path/to/file` to grab a single updated file from the remote.'
  explanation: '`git pull` always fetches and merges entire commits. To update just one file, run `git fetch origin` first, then `git restore --source=origin/main -- path/to/file` to overwrite your local copy with the remote version without merging everything else; the change is left unstaged, like any other edit.'
  tags: [git]
- date: 2026-03-21
  tip: 'Use a Git worktree when you need to context-switch without disrupting your current in-progress work.'
  explanation: 'By default, a Git repo has one worktree (your main checkout). With `git worktree add ../hotfix hotfix-branch`, you create an additional directory on disk that checks out a different branch. Each worktree has its own files and index but shares the same Git history, so there is no need to stash or commit before switching tasks.'
  tags: [git]
- date: 2026-03-22
  tip: 'Think on the margin: base decisions on the additional cost and benefit of one more unit, not on totals or averages.'
  explanation: 'Marginal thinking asks "should I do one more?" rather than "should I do this at all?" For example, whether to work an extra hour depends on what that specific hour yields versus what it costs you, not on how many hours you have already put in. Sunk costs are irrelevant; only the next unit matters.'
  tags: [economics]
- date: 2026-03-23
  tip: 'Use `cut -f2-` to extract from the second field onwards.'
  explanation: 'The `-f` flag in `cut` accepts range specifiers: `2-` means field 2 through the last field, `1-3` means fields 1 to 3, and `-4` means fields 1 to 4.'
  tags: [shell]
- date: 2026-03-24
  tip: 'Use `Reduce(merge, my_list)` to merge a whole list of data frames into one.'
  explanation: '`merge()` only joins two data frames at a time, so to combine a list of them, fold the list with `Reduce()`: it merges the first two, then merges that result with the third, and so on, with no loops or repeated calls needed.'
  tags: [rstats]
- date: 2026-03-25
  tip: 'Reduce friction for good habits and increase it for bad ones.'
  explanation: 'Make the desired behaviour the path of least resistance: lay out your running shoes the night before, keep healthy snacks at eye level, or delete distracting apps from your home screen. The more effort a behaviour requires, the less likely it is to happen, so design your environment to work for you rather than against you.'
  tags: [self-help, habits]
- date: 2026-03-26
  tip: "Use Bash parameter expansion `${var//pattern/replacement}` for global substitution without calling `sed`."
  explanation: "A single slash `${var/pattern/replacement}` replaces the first match; a double slash replaces all. The pattern and replacement can use `$'...'` quoting for special characters, e.g. `${FOOBAR//$'\\n'/_}` replaces every newline with an underscore."
  tags: [shell, bash]
- date: 2026-03-27
  tip: "Use `${BASH_SOURCE[0]}` instead of `$0` to get the script's own path."
  explanation: "`$0` changes when a script is sourced (it becomes the caller's name), but `${BASH_SOURCE[0]}` always refers to the file where the code is written."
  tags: [shell, bash]
- date: 2026-03-28
  tip: 'Use a here-string `<<< "$var"` instead of `echo "$var" | cmd`.'
  explanation: 'A here-string feeds a string directly to a command''s stdin without spawning a subshell for `echo` and a pipe, e.g. `wc -w <<< "$sentence"`.'
  tags: [shell, bash]
- date: 2026-03-29
  tip: 'If you always do more than is expected of you, you will always be expected to do more.'
  explanation: 'Exceeding expectations is a double-edged sword: it demonstrates your capability but quietly resets the baseline so that exceptional effort becomes the new normal. Be deliberate about when you go above and beyond.'
  tags: [self-help]
- date: 2026-03-30
  tip: 'Compare yourself to who you were yesterday, not to who someone else is today.'
  explanation: 'Measuring progress against others invites envy and discouragement because you are comparing yourself with their highlight reel. The only meaningful benchmark is your own trajectory.'
  tags: [self-help]
- date: 2026-03-31
  tip: 'Use `readRDS(url("https://example.com/file.rds", "rb"))` to load an RDS file directly from a URL.'
  explanation: 'Wrapping a URL in `url(..., "rb")` opens a binary connection that `readRDS()` can read from directly, so you can skip downloading the file to disk first.'
  tags: [rstats]
- date: 2026-04-01
  tip: 'Exclude `.map` files from your NPM package by adding them to `.npmignore` or using the `files` field in `package.json`.'
  explanation: 'Source maps (`.js.map`) are debug files that map minified JavaScript back to original TypeScript. They are useful during development but should never ship to production or be published to NPM, as they expose your original source code and bloat the package.'
  tags: [javascript]
- date: 2026-04-02
  tip: 'Use spaced repetition to retain what you learn.'
  explanation: 'Review material at increasing intervals, e.g. after 1 day, 3 days, 1 week, then 2 weeks, to exploit the spacing effect. Anki is a free, open-source flashcard app that automates this schedule for you, but even a simple calendar reminder works.'
  tags: [self-help, learning]
- date: 2026-04-03
  tip: 'A 2 by 2 contingency table can help illustrate marginal and conditional probability.'
  explanation: 'Marginal probabilities are the row and column proportions, and conditional probabilities are the respective ratios on rows and columns.'
  tags: [statistics]
- date: 2026-04-04
  tip: 'Before rewarding a result, ask how someone could earn the reward without delivering the result.'
  explanation: 'In 1902, French colonial Hanoi paid a bounty for every rat tail handed in; officials soon saw tail-less rats in the streets, because catchers were cutting off tails and releasing the rats to breed, and some farmed rats outside the city. Historian Michael Vann found the episode in the colonial archives. A reward pays for the evidence you check, not the outcome you want, so make the two as close as you can.'
  tags: [economics]
- date: 2026-04-05
  tip: '`autoload -Uz zcalc && zcalc`'
  explanation: '`zcalc` is an autoloadable function shipped with Zsh (not a built-in) that gives you a calculator supporting floating point, variables, and math functions like `sin()` and `log()`. It keeps a history of results accessible via `$1`, `$2`, etc. No need to install `bc` or `python` just to do quick maths.'
  tags: [shell, zsh]
- date: 2026-04-06
  tip: 'DBSCAN clusters by density, so it can find arbitrarily shaped clusters and naturally identifies outliers as noise.'
  explanation: 'Unlike k-means, DBSCAN does not require you to specify the number of clusters in advance and is not biased toward spherical shapes. Points in sparse regions are labelled as noise (`-1` in sklearn), making it a great first choice when your data has irregular structure or outliers.'
  tags: [statistics, machine-learning]
- date: 2026-04-07
  tip: 'Spectral clustering uses the eigenvectors of a similarity graph to find clusters that k-means alone would miss.'
  explanation: 'A similarity graph is built by connecting each point to its nearest neighbours (or all points within a radius) with edges weighted by a kernel such as the Gaussian. Then the spectrum (eigenvalues) of the graph Laplacian embeds points into a lower-dimensional space where standard k-means works well.'
  tags: [statistics, machine-learning]
- date: 2026-04-08
  tip: '`ggplot(df, aes(x = forcats::fct_reorder(category, value), y = value))`'
  explanation: '`fct_reorder()` reorders factor levels by a summary of another variable (median by default). This is the easiest way to turn an alphabetically sorted bar or box plot into one sorted by magnitude, which is almost always more informative.'
  tags: [rstats, visualisation]
- date: 2026-04-09
  tip: 'Use `data.table::fread()` instead of `read.csv()` or `readr::read_csv()` for large files.'
  explanation: '`fread()` is typically 5-10x faster than `readr::read_csv()` and orders of magnitude faster than base `read.csv()`. It auto-detects delimiters, column types, and handles compressed files, and you can use the `select` argument to read only the columns you need.'
  tags: [rstats]
- date: 2026-04-10
  tip: 'Read many CSV files into one data frame with `readr::read_csv(files, id = "file")`.'
  explanation: '`read_csv()` accepts a vector of paths, such as `files <- list.files("data", pattern = "\\.csv$", full.names = TRUE)`, and stacks them as long as they have the same columns. `id = "file"` adds a column holding the path each row came from, so you can still tell the files apart.'
  tags: [rstats, tidyverse]
- date: 2026-04-11
  tip: "Tobler's First Law of Geography: 'Everything is related to everything else, but near things are more related than distant things.'"
  explanation: "This principle underpins spatial statistics and methods like kriging, inverse-distance weighting, and spatial autocorrelation (Moran's I). If your data has a location component, ignoring spatial proximity often means ignoring the strongest signal in the data."
  tags: [statistics]
- date: 2026-04-12
  tip: 'Simpson''s Paradox: a trend in subgroups can reverse when the groups are combined.'
  explanation: 'Imagine comparing two drugs. Drug A has a higher survival rate than Drug B among mild cases and also among severe cases. But if most patients given Drug B had mild cases (who survive more easily regardless of treatment), Drug B can appear better overall. The uneven mix of mild and severe patients between the two groups distorts the combined result.'
  tags: [statistics]
- date: 2026-04-13
  tip: 'In Markdown pipe tables, the relative length of the hyphens in the separator row controls column width.'
  explanation: '`| Name | Description |` followed by `|------|--------------------------|` makes the second column roughly four times wider than the first. The ratio of hyphens is what matters, not the absolute count. In Pandoc (Quarto, R Markdown) the ratio only takes effect when a line of the table source is wider than `--columns` (default 72) so the table wraps; otherwise columns are sized to their content. GitHub-flavoured Markdown ignores it entirely.'
  tags: [markdown, quarto]
- date: 2026-04-14
  tip: '`ubuntu-drivers devices`'
  explanation: 'Lists your hardware and the recommended drivers for each device, most commonly for NVIDIA GPUs. Follow up with `sudo ubuntu-drivers autoinstall` to install the recommended driver, or `sudo apt install nvidia-driver-XXX` to pick a specific version. Saves you from manually matching your GPU model to the right driver package.'
  tags: [linux, sysadmin, debian]
- date: 2026-04-15
  tip: 'The [Central Limit Theorem](https://davetang.github.io/muse/clt.html) is why many statistical tests work even when your data are not normally distributed.'
  explanation: 'The CLT says that the distribution of sample means approaches a normal distribution as the sample size grows, regardless of the shape of the underlying population.'
  tags: [statistics]
- date: 2026-04-16
  tip: '`qstat -f -u ''*''`'
  explanation: 'Shows a full-format queue listing for all users, including per-queue load and slot usage. Useful for understanding cluster state before submitting; you see which queues are full and where your job is likely to land.'
  tags: [hpc]
- date: 2026-04-17
  tip: '`apt-file search <filename>`'
  explanation: '`apt-file` finds which package contains a given file, even if the package is not installed. Install with `sudo apt install apt-file && sudo apt-file update`, then run `apt-file search /usr/include/zlib.h` to discover you need `zlib1g-dev`.'
  tags: [debian, sysadmin]
- date: 2026-04-18
  tip: '`alias -g G=''| grep''` defines a Zsh global alias that expands anywhere on the command line.'
  explanation: 'Regular aliases only expand as the first word of a command, but Zsh global aliases (`alias -g`) expand wherever the token appears. With `alias -g G=''| grep''` and `alias -g L=''| less''`, you can write `ps aux G ssh L` instead of `ps aux | grep ssh | less`.'
  tags: [shell, zsh]
- date: 2026-04-19
  tip: 'Jevons paradox: improvements in resource efficiency often *increase* total consumption rather than reduce it.'
  explanation: 'When steam engines became more coal-efficient in the 19th century, total coal use went up, not down, because efficiency made coal-powered activity cheaper and more pervasive. The paradox is a useful caution whenever someone claims a more efficient technology will automatically reduce resource use; the rebound effect can wipe out or exceed the savings.'
  tags: [economics]
- date: 2026-04-20
  tip: 'Loss aversion: people feel the pain of a loss roughly twice as strongly as the pleasure of an equivalent gain.'
  explanation: 'Loss aversion explains why investors hold losing stocks too long hoping to break even, why "don''t lose $10" motivates more than "gain $10", and why free trials convert well (once you have something, giving it up feels like a loss).'
  tags: [economics]
- date: 2026-04-21
  tip: 'Satisficing: pick the first option that is "good enough" instead of searching for the optimum.'
  explanation: 'Coined by Herbert Simon as part of his theory of bounded rationality, satisficing recognises that the cost of continued search usually exceeds the marginal gain from finding a slightly better option.'
  tags: [economics, decision-making]
- date: 2026-04-22
  tip: 'When reading an annual report, start with the shareholder letter, then jump straight to MD&A.'
  explanation: 'The Chairman or CEO''s letter is written in plain English and signals what management thinks matters; the Management''s Discussion and Analysis (MD&A) section then explains why the numbers changed year-over-year.'
  tags: [economics]
- date: 2026-04-23
  tip: 'Load a 10x Xenium output bundle into Seurat with `Seurat::LoadXenium("path/to/outs")`.'
  explanation: 'Reads the `cell_feature_matrix.h5` counts, `cells.parquet` metadata, segmentation boundaries, and `transcripts.parquet` molecule coordinates into a single Seurat v5 object with a `Xenium` assay and an FOV ready for `ImageDimPlot()` / `ImageFeaturePlot()`. Follow it with `subset(xen, nCount_Xenium > 0)` to drop empty cells, and note that control/blank codeword probes land in their own assays for QC.'
  tags: [rstats, bioinformatics]
- date: 2026-04-24
  tip: 'Wrap a chunk with `tictoc::tic(); ...; tictoc::toc()` to print elapsed wall-clock time.'
  explanation: '`toc()` prints something like `2.314 sec elapsed` and invisibly returns a list with `tic`, `toc`, `msg`, and `callback_msg` so you can capture the timing in a variable.'
  tags: [rstats]
- date: 2026-04-25
  tip: 'Use `waldo::compare(x, y)` instead of `all.equal()` for human-readable diffs of two R objects.'
  explanation: '`all.equal()` returns terse strings like `"Mean relative difference: 0.04"` that tell you something differs but not where; `waldo::compare()` prints a coloured, side-by-side diff pinpointing each mismatched element, attribute, or list slot.'
  tags: [rstats, debugging]
- date: 2026-04-26
  tip: 'Pipe a freshly-read data frame through `janitor::clean_names()` to convert messy column names to snake_case in one step.'
  explanation: '`janitor::clean_names()` handles spaces, punctuation, accented characters, leading numbers, and duplicates automatically.'
  tags: [rstats]
- date: 2026-04-27
  tip: 'Save large data frames as Parquet with `arrow::write_parquet(df, "data.parquet")` instead of CSV.'
  explanation: 'Parquet stores types, is column-compressed, and reads roughly 10 to 100x faster than the equivalent CSV with `arrow::read_parquet()`. Pair with `arrow::open_dataset("dir/")` to query a folder of partitioned Parquet files lazily via `dplyr` verbs without loading everything into memory.'
  tags: [rstats, file-formats]
- date: 2026-04-28
  tip: 'Bootstrap project boilerplate with `usethis::use_*()` calls, e.g., `use_git()`, `use_readme_md()`, `use_mit_license()`, `use_github_action("check-standard")`.'
  explanation: 'Each helper makes the smallest correct change: `use_git()` initialises the repo and stages the right files, `use_github_action()` drops the YAML in `.github/workflows/`, and `use_release_issue()` generates a release checklist.'
  tags: [rstats]
- date: 2026-04-29
  tip: 'When a measure becomes a target, it ceases to be a good measure.'
  explanation: 'This famous one-liner is anthropologist Marilyn Strathern''s 1997 reformulation of Goodhart''s law; Charles Goodhart''s 1975 original was the drier "any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes". Optimising for a proxy distorts behaviour around the proxy itself: schools teaching to the test, call centres rushing calls to hit handle-time targets, ML models gaming a flawed loss function.'
  tags: [economics]
- date: 2026-04-30
  tip: 'An externality is a cost or benefit of an action that falls on someone who did not choose to take part.'
  explanation: 'Pollution is the textbook negative externality (the factory profits, neighbours bear the cost); vaccination is a positive one (your immunity protects others). Markets systematically over-supply activities with negative externalities and under-supply ones with positive externalities, which is the standard rationale for taxes, subsidies, and regulation.'
  tags: [economics]
- date: 2026-05-01
  tip: 'Ship small, frequent pull requests instead of one big-bang merge.'
  explanation: 'Small PRs get reviewed within hours rather than days, surface design problems before you have built on top of them, are dramatically easier to revert, and keep the team unblocked because nobody is waiting on a 2,000-line review.'
  tags: [teamwork]
- date: 2026-05-02
  tip: 'Write a team working agreement: an explicit, one-page contract for *how* you work together.'
  explanation: 'A working agreement codifies the norms that usually live in people''s heads; core hours, code-review SLA, decision-making process, definition of done, meeting etiquette. Making them explicit means new joiners onboard in minutes instead of months, and disagreements become "let''s revisit the agreement" rather than interpersonal conflict.'
  tags: [teamwork]
- date: 2026-05-03
  tip: 'Agree on a "Definition of Done" so the team shares one quality bar.'
  explanation: 'A short checklist including tests pass, docs updated, monitored in production, reviewed by one other engineer, turns "is this finished?" from an opinion into a fact.'
  tags: [teamwork]
- date: 2026-05-04
  tip: 'Default to written, async communication; reserve meetings for decisions and disagreement.'
  explanation: 'A written update in a shared channel costs the author 5 minutes and the readers 30 seconds each at a time of their choosing; the same content as a 30-minute status meeting costs N times 30 minutes synchronously and leaves no searchable trail. Reserve real-time time for things that genuinely need back-and-forth: aligning on a contentious decision, unblocking a stalled debate, or onboarding.'
  tags: [teamwork]
- date: 2026-05-05
  tip: 'Use "Five Whys" in incident analysis: keep asking *why?* until you reach a root cause, not just a trigger.'
  explanation: 'Pioneered at Toyota, Five Whys forces the conversation past the surface ("the deploy script crashed") to the systemic cause ("we have no integration test that exercises the deploy path"). The number five is a heuristic, sometimes three is enough, sometimes you need seven, but the discipline of repeatedly asking *why* is what turns a bug fix into a class of bugs prevented.'
  tags: [teamwork]
- date: 2026-05-06
  tip: 'Conway''s law: any system''s structure mirrors the communication structure of the organisation that built it.'
  explanation: 'From Mel Conway''s paper "How Do Committees Invent?" (published April 1968 in *Datamation* after Harvard Business Review rejected it the year before), the observation is that a four-team compiler will tend to be a four-pass compiler, because team boundaries become module boundaries by default. Once you see it, you spot it everywhere: micro-services that match team org-charts, monoliths shipped by single-team startups, weird APIs whose seams trace exactly to the meeting where two teams agreed on an interface.'
  tags: [teamwork]
- date: 2026-05-07
  tip: 'Hold strong opinions, weakly: state your position with conviction, but update fast when evidence contradicts it.'
  explanation: 'Attributed to futurist Paul Saffo, the heuristic dodges two failure modes: the wishy-washy contributor who never commits to a view, and the stubborn one who treats their first take as identity.'
  tags: [teamwork, decision-making]
- date: 2026-05-08
  tip: 'Before opening a book or paper, write down the one question you want it to answer.'
  explanation: 'Reading without a target turns into passive scrolling; an explicit question gives every page a pass/fail test ("does this help me answer X?") and makes it obvious when to skim, slow down, or stop. Even a vague question like "why does this method beat baseline?" beats no question at all.'
  tags: [self-help, learning]
- date: 2026-05-09
  tip: 'Convert vague intentions into "I will [behaviour] at [time] in [location]".'
  explanation: 'Peter Gollwitzer''s research shows that this if-then specificity roughly doubles follow-through versus "I will exercise more". "I will meditate at 7am in the living room" gives your future self an unambiguous cue and removes the in-the-moment negotiation that usually loses.'
  tags: [self-help, habits]
- date: 2026-05-10
  tip: 'Use `git rm --cached file` to stop tracking a file without deleting it from your working tree.'
  explanation: 'Plain `git rm file` deletes the file from both the index and your disk; the `--cached` flag removes it only from the index, so the next commit no longer tracks it but the file itself is preserved. Useful when you accidentally committed something that should have been ignored.'
  tags: [git]
- date: 2026-05-11
  tip: 'Pin Docker base images by digest: `FROM ubuntu@sha256:abc123...` instead of `FROM ubuntu:24.04`.'
  explanation: 'Tags like `:24.04` or `:latest` are mutable; the maintainers can repush them tomorrow and your build silently changes. Get the immutable digest with `docker buildx imagetools inspect ubuntu:24.04` and paste it into the `FROM` line so the same Dockerfile pulls the exact same bytes a year from now.'
  tags: [docker, best-practice]
- date: 2026-05-12
  tip: 'Use `uv` (from Astral) as a single, fast replacement for `pip`, `venv`, `pip-tools`, and `pyenv`.'
  explanation: 'Written in Rust, `uv` resolves and installs packages 10-100x faster than `pip` and rolls virtual environments, lockfiles, and Python version management into one tool. Install with `curl -LsSf https://astral.sh/uv/install.sh | sh`, then `uv --help` to see the full command surface.'
  tags: [python]
- date: 2026-05-13
  tip: 'Add `--follow` to `git log` to keep a file''s history going past a rename: `git log --follow -p path/to/file.txt`.'
  explanation: 'Without `--follow`, `git log -- path` stops at the commit that created the current filename, hiding everything from before the rename. `--follow` spots commits where most of the content moved from another path and carries on from there. It only works with a single file.'
  tags: [git]
- date: 2026-05-14
  tip: 'Run `file mystery.bin` to find out what a file really is; extensions can lie, `file` reads the bytes.'
  explanation: '`file` consults libmagic''s database of "magic numbers" (signature bytes at known offsets) to identify the format, so a `.txt` that is actually a PNG, or a `.csv` that is actually UTF-16 with a BOM, is immediately exposed. Useful when a tool complains about an "invalid format" and you do not yet know what you have.'
  tags: [linux, shell]
- date: 2026-05-15
  tip: 'Schedule low-intensity maintenance practice for skills you have already learned, not just new ones.'
  explanation: 'Skills decay measurably without use: pilots lose instrument-flying precision in weeks, surgeons lose suturing speed in months, languages lose fluency in a year or two. Treating a skill as "done" once acquired is the failure mode; a small recurring slot on the calendar (even monthly) is what keeps it from quietly slipping away.'
  tags: [self-help, learning]
- date: 2026-05-16
  tip: 'Run `git worktree list` to audit every checkout attached to the repo and spot stale or detached ones.'
  explanation: 'The output shows the path, current commit, and branch (or `(detached HEAD)`) for every worktree, plus `[locked]` and `[prunable]` markers. It is the fastest way to find a worktree you forgot about, one that is on a detached HEAD, or two checkouts accidentally pointing at the same branch.'
  tags: [git]
- date: 2026-05-17
  tip: 'Before risky network changes on a headless box, run `sudo shutdown -r +10` as a dead-man''s switch.'
  explanation: 'If you lock yourself out, the box reboots in 10 minutes with the old config still on disk and you regain SSH. Once you have confirmed the new setup works from a separate connection, cancel the pending reboot with `sudo shutdown -c`. Cheap, reversible, and avoids a console trip or a remote-hands ticket.'
  tags: [linux, sysadmin, networking]
- date: 2026-05-18
  tip: 'Run `traceroute 1.1.1.1` to find which network hop is dropping or slowing your traffic.'
  explanation: 'Your packets pass through a chain of routers on the way to a destination, and `traceroute` lists each one with how long it took to respond. If the times stay small for the first few hops and then jump from 20ms to 300ms at hop 7, the slowness is on the link between hop 6 and hop 7, and not your laptop, not Cloudflare. `1.1.1.1` is just a handy target: Cloudflare''s public DNS, reachable from almost anywhere, and short to type.'
  tags: [linux, networking]
- date: 2026-05-19
  tip: '"Absence of evidence is not evidence of absence"; failing to find X only rules X out if you looked hard enough to have found it.'
  explanation: 'Popularised by Carl Sagan, the rule warns that "I did not find X" stays inconclusive on two counts: *coverage* (did you search everywhere X could be?) and *sensitivity* (would your method have detected X if it were there?). A two-minute Google fails the coverage test; a blood test with 60% sensitivity coming back negative fails the sensitivity one.'
  tags: [self-help, decision-making]
- date: 2026-05-20
  tip: 'Put `2>&1` after `>file`, not before: `cmd 2>&1 >file` still sends errors to the terminal.'
  explanation: 'The shell sets up redirections left to right, and `2>&1` points stderr at wherever stdout goes at that moment. In `2>&1 >file`, that''s still the terminal, and stdout only moves to the file afterwards. In `>file 2>&1`, stdout moves first, so stderr follows it into the file.'
  tags: [shell]
- date: 2026-05-21
  tip: 'In `{future}`, prefer `plan(multisession)` over `plan(multicore)` because each worker is a fresh R process with its own file handles and connections.'
  explanation: '`multicore` forks the current R process, so workers inherit (and accidentally share) open file handles, database connections, and the RNG state, leading to corrupted output or deadlocks. `multisession` spawns clean R processes communicating over sockets; slower to start, but safer and cross-platform (`multicore` does not work on Windows or in RStudio).'
  tags: [rstats, parallel]
- date: 2026-05-22
  tip: 'After parallel work with `plan(multisession)`, call `plan(sequential)` to shut the worker R processes down.'
  explanation: 'Each `multisession` worker is a full R process that stays alive in the background until explicitly terminated; left running, they hold memory, open connections, and clutter your process list. `plan(sequential)` tears down the cluster cleanly and restores the default execution mode.'
  tags: [rstats, parallel]
- date: 2026-05-23
  tip: 'For SSH over a flaky link, set `ServerAliveInterval 30` and `ServerAliveCountMax 10` in `~/.ssh/config` so the session tolerates moments of silence before giving up.'
  explanation: 'The client probes the server every 30 seconds when the link is idle and waits for ten consecutive failures before declaring the session dead. On a healthy connection nothing changes; on a flaky one, brief drop-outs come back without killing your shell, your editor, or your half-finished command.'
  tags: [linux, ssh]
- date: 2026-05-24
  tip: 'Run `ssh-add ~/.ssh/id_ed25519` once per login to type your key passphrase once and have every later `ssh` connection authenticate silently.'
  explanation: '`ssh-agent` is a local background process that holds decrypted private keys in memory and listens on a Unix socket at `$SSH_AUTH_SOCK`. `ssh-add` reads a key, decrypts it with your passphrase, and hands it to the agent; every subsequent `ssh` client asks the agent to sign the auth challenge; the key never leaves the agent, never touches the network.'
  tags: [linux, ssh]
- date: 2026-05-25
  tip: 'Marcus Aurelius noticed that none of us could survive a day if forced to speak every thought aloud: proof of how much we hide to manage other people''s opinions of us.'
  explanation: 'In *Meditations* 12.4, he points out the absurdity that we love ourselves more than other people yet care more about *their* opinion of us than our own and the gap between mind and mouth is the evidence. Useful as a sincerity check: notice when you are editing a thought purely for the audience, and ask whether that is the kind of editing you can live with.'
  tags: [self-help]
- date: 2026-05-26
  tip: 'In the browser DevTools console, run `document.querySelector("video").playbackRate = 2.5` to speed up any HTML5 video, even on sites whose UI caps at 2x.'
  explanation: 'The `playbackRate` property accepts arbitrary positive numbers (1.5, 2.5, 4), bypassing whatever speed buttons the site exposes. Useful for training videos, webinars, and lecture replays that ship with no built-in speed control.'
  tags: [javascript]
- date: 2026-05-27
  tip: 'Run `zsh -xl 2>&1 | head -80` to trace every command Zsh executes during login startup.'
  explanation: '`-x` prints each command before it runs (like Bash''s `set -x`), `-l` simulates a login shell so all startup files (`/etc/zprofile`, `~/.zprofile`, `~/.zshrc`, `~/.zlogin`) are sourced. Redirect stderr with `2>&1` because trace output goes to stderr.'
  tags: [zsh, debugging]
- date: 2026-05-28
  tip: 'A hard link is a second name for the same inode; a symlink is a small file that just stores a path to another name.'
  explanation: 'An inode is the on-disk record holding a file''s metadata (permissions, size, timestamps) and pointers to its actual data blocks; everything except the filename. Run `ls -i` to see inode numbers: a hard link (`ln target name`) shares the exact same inode as its target, so both names are equal peers pointing at one set of data blocks, while a symlink (`ln -s target name`) has its own inode and merely contains the target''s path as text.'
  tags: [linux, shell]
- date: 2026-05-29
  tip: 'Run `df -hT` to see disk usage in human-readable sizes with each filesystem''s type.'
  explanation: '`-h` prints sizes in K/M/G instead of raw blocks. The `-T` flag shows the filesystem type alongside each mount. You''ll see the type column showing `smbfs`, `nfs`, `apfs`, etc., which makes it easy to tell network mounts from local disks at a glance.'
  tags: [linux, shell]
- date: 2026-05-30
  tip: 'Use `lsof -p <pid>` to see every file, socket, and pipe a process currently has open.'
  explanation: '`lsof` ("list open files") treats every kernel descriptor as a file, so the output covers regular files, network sockets, pipes, and devices. Invaluable for "what is holding this file open?" (`lsof /path/to/file`) or "which process is listening on port 8080?" (`lsof -i :8080`).'
  tags: [linux, sysadmin]
- date: 2026-05-31
  tip: 'Use `pwdx <pid>` to see the current working directory of a running process.'
  explanation: '`pwdx` reads the `cwd` symlink in `/proc/<pid>/` and prints its target. Useful when a script is writing files relative to its working directory and you cannot tell from `ps` alone where the output is actually landing.'
  tags: [linux, sysadmin]
- date: 2026-06-01
  tip: 'Use `prlimit --pid <pid>` to inspect (and live-modify) a running process''s resource limits.'
  explanation: 'Shows all `ulimit` values (open files, address space, core dump size, and CPU time) for an already-running process, without restarting it. Pass `--nofile=8192` to raise the open-files cap on a daemon that is failing with `EMFILE` mid-run, no service restart required.'
  tags: [linux, sysadmin]
- date: 2026-06-02
  tip: 'For tired-and-wired, take a short walk outside, ideally on something green.'
  explanation: 'Gregory Bratman''s 2015 Stanford study (PNAS 112:8567) showed that a 90-minute walk in nature reduced rumination and subgenual prefrontal cortex activity versus an urban walk, suggesting that green space (not just movement) does the work. A short outdoor break is no substitute for the full 90 minutes but still gets sunlight on the retina to reset the circadian system, which helps when the underlying problem is fatigue, not motivation.'
  tags: [self-help]
- date: 2026-06-03
  tip: 'When you need to `git pull` but have uncommitted changes, run `git stash push`, then `git pull`, then `git stash pop` to reapply your work on top.'
  explanation: '`git stash push` shelves your uncommitted changes onto a stack and gives you a clean working tree, so `git pull` won''t refuse to overwrite files you have edited. `git stash pop` then reapplies the stashed changes and removes them from the stack. If the pop hits conflicts, Git keeps the stash entry so nothing is lost: resolve the conflicts, then run `git stash drop` yourself.'
  tags: [git]
- date: 2026-06-04
  tip: 'Use `git restore --staged file` to unstage and `git restore file` to discard working-tree changes.'
  explanation: 'These modern commands (introduced in Git 2.23) split the confusing dual role of `git reset` and `git checkout` into two clearly named verbs. `git restore --staged` is the new way to undo `git add`; plain `git restore file` is the new way to throw away unsaved edits.'
  tags: [git]
- date: 2026-06-05
  tip: 'Use `git switch -c new-branch` instead of `git checkout -b new-branch` to create and switch branches.'
  explanation: 'Before Git 2.23, `git checkout` was the only way to switch branches (`git checkout main`, `git checkout -b feature`). The catch was that the same verb also overwrote files (`git checkout -- file`), so a slip like `git checkout .` could silently wipe uncommitted work. Git 2.23 split it into `git switch` (branches) and `git restore` (files).'
  tags: [git]
- date: 2026-06-06
  tip: 'Use the null-coalescing operator `x %||% y` to fall back to `y` when `x` is `NULL`.'
  explanation: 'Defined as `function(x, y) if (is.null(x)) y else x`, so `NULL %||% "default"` returns `"default"` and `"value" %||% "default"` returns `"value"`. Available in base R since version 4.4.0 (April 2024); before that it lived in {rlang} and was widely used inside tidyverse packages.'
  tags: [rstats]
- date: 2026-06-07
  tip: 'Press `Ctrl-a ?` in GNU screen to bring up the help screen listing every key binding.'
  explanation: 'When you have forgotten a command, `Ctrl-a ?` shows the full list of `screen` key bindings and the commands they map to. Press space or return to page through it and any other key to exit.'
  tags: [screen]
- date: 2026-06-08
  tip: 'Use `echo "command" | at 09:00 tomorrow` to schedule a one-off job (install with `sudo apt install at`).'
  explanation: 'Unlike `cron`, which repeats, `at` runs a command exactly once at a future time. It accepts natural times like `at 09:00`, `at now + 1 hour`, or `at 14:30 next friday`, and emails or saves the output.'
  tags: [shell, linux, sysadmin]
- date: 2026-06-09
  tip: 'Add `-x` to `git clean` to also delete files ignored by `.gitignore`, e.g. `git clean -fdx`.'
  explanation: 'By default `git clean` skips files matched by `.gitignore` (like `node_modules/` or `*.o`). The lowercase `-x` removes ignored files too for a truly pristine tree, while uppercase `-X` removes *only* the ignored files and keeps other untracked ones.'
  tags: [git]
- date: 2026-06-10
  tip: 'Run `defaults write NSGlobalDomain ApplePressAndHoldEnabled -bool false` so holding a key repeats it on macOS.'
  explanation: 'By default macOS shows an accent-picker popup when you hold a key, which breaks key repeat, which is annoying when holding `j`/`k` to move in Vim. Setting this to false restores repeat; log out and back in (or restart the app) for it to take effect, and use `-bool true` to revert.'
  tags: [macos]
- date: 2026-06-11
  tip: 'Use `janitor::tabyl(df, var)` for a frequency table that beats base `table()`.'
  explanation: 'Unlike `table()`, `tabyl()` returns a data frame, keeps `NA` visible by default, and chains with `adorn_*()` helpers like `adorn_totals()` and `adorn_pct_formatting()` to add totals and percentages for publication-ready cross-tabs.'
  tags: [rstats]
- date: 2026-06-12
  tip: 'sleep 25m && while true; do say "Timer done"; sleep 2; done'
  explanation: 'On macOS, `say` can be used to say things; couple it with `sleep` and `while` to implement a simple timer!'
  tags: [macos]
- date: 2026-06-13
  tip: 'The {mcptools} package lets R act as both an MCP server and client.'
  explanation: 'Built on {ellmer}, [mcptools](https://posit-dev.github.io/mcptools/) implements the Model Context Protocol so tools like Claude Desktop or Claude Code can drive a live R session, or so R can consume external MCP servers.'
  tags: [rstats, llm]
- date: 2026-06-14
  tip: 'Use the {btw} package to describe your R environment to an LLM.'
  explanation: 'Call `btw()` on data frames, objects, or help pages and [btw](https://posit-dev.github.io/btw/) writes a clipboard-ready, context-rich description for pasting into a chat; it also plugs into {ellmer} as tools and can run as an MCP server via `btw_mcp_server()`.'
  tags: [rstats, llm]
- date: 2026-06-15
  tip: "alias history='fc -li -1000'"
  explanation: 'Create a Zsh alias that will show the last 1000 commands across sessions, with `-i` adding ISO date-time stamps to each entry, which makes it easier to see when a command was used!'
  tags: [zsh]
- date: 2026-06-16
  tip: 'How many times do I multiply the base by itself to reach this number?'
  explanation: 'That question is the intuition behind a logarithm: `log_b(x)` is the exponent that turns the base `b` into `x`. For example `log_2(8) = 3` because `2 * 2 * 2 = 8`. This is why logs turn multiplication into addition and compress huge ranges, which is handy for log scales and orders of magnitude.'
  tags: [maths]
- date: 2026-06-17
  tip: '`docker run --rm -i hadolint/hadolint < Dockerfile`'
  explanation: '[hadolint](https://github.com/hadolint/hadolint) parses the Dockerfile into an AST and flags issues like unpinned packages, using `latest` tags, or `cd` instead of `WORKDIR`; piping into the official image lints it without installing anything.'
  tags: [docker, best-practice]
- date: 2026-06-18
  tip: 'Add `--nv` to give a Singularity container access to the host NVIDIA GPU.'
  explanation: '`singularity exec --nv img.sif nvidia-smi` binds in the host GPU driver libraries so CUDA workloads run inside the container; use `--rocm` for AMD GPUs.'
  tags: [singularity, gpu]
- date: 2026-06-19
  tip: 'Prefix a host variable with `SINGULARITYENV_` to pass it into the container.'
  explanation: '`export SINGULARITYENV_FOO=bar` before running makes `$FOO` available inside the container (works with `shell`/`exec`/`run`); it must be exported first. This is the controlled counterpart to `--cleanenv`, which strips host variables out. On Apptainer the native prefix is `APPTAINERENV_`.'
  tags: [singularity]
- date: 2026-06-20
  tip: 'Use `rg pattern` (ripgrep) instead of `grep -r pattern .`'
  explanation: 'ripgrep searches recursively by default, is much faster than `grep -r`, and automatically skips files in `.gitignore` and hidden/binary files; add `-uuu` to disable all that filtering and search everything.'
  tags: [shell]
- date: 2026-06-21
  tip: 'Use `fd pattern` instead of `find . -name "*pattern*"`.'
  explanation: 'fd does a recursive, regex-by-default search with much less typing, runs fast in parallel, and skips `.gitignore`d and hidden files automatically; add `-H` to include hidden files and `-I` to ignore the ignore rules. On Debian the binary is `fdfind`.'
  tags: [shell]
- date: 2026-06-22
  tip: 'Run `git update-server-info` to clone a bare repo over plain HTTP.'
  explanation: 'A static web server has no Git smarts, so the "dumb" HTTP protocol needs the auxiliary files in `info/refs` and `objects/info/packs`; `git update-server-info` regenerates them so `git clone https://host/repo.git` works without git-http-backend.'
  tags: [git]
- date: 2026-06-23
  tip: 'Enable the `post-update` hook to keep `update-server-info` current.'
  explanation: 'Git ships a sample `hooks/post-update.sample` that just runs `git update-server-info`; rename it to `post-update` (and `chmod +x`) in a bare repo so the dumb-HTTP info files refresh automatically on every push.'
  tags: [git]
- date: 2026-06-24
  tip: 'Put `eval "$(keychain --eval --quiet id_ed25519)"` in your shell startup.'
  explanation: 'Plain `ssh-agent`/`ssh-add` starts a fresh agent each login so you re-enter your passphrase every time; `keychain` finds or starts a single long-lived agent, reuses it across logins and `screen`/`tmux` sessions, and `--eval` prints the env vars for your shell to source (`--quiet` suppresses its banner).'
  tags: [linux, ssh]
- date: 2026-06-25
  tip: 'Before adopting a tool, ask how hard it would be to leave it.'
  explanation: 'Vendor lock-in is the cost (switching cost) that makes leaving a product impractical; weigh the exit cost at adoption time, not after your data and workflows are already trapped inside.'
  tags: [economics, decision-making]
- date: 2026-06-26
  tip: 'Odds are not probability: odds compare favourable to unfavourable, probability to the total.'
  explanation: 'A probability of $p = 1/6$ for rolling a six is 1 outcome out of 6 total, but the odds are 1 to 5 (favourable to unfavourable); convert with `odds = p / (1 - p)` and `p = odds / (1 + odds)`.'
  tags: [statistics]
- date: 2026-06-27
  tip: 'Use `git bundle create repo.bundle --all` to put a whole repo in one file.'
  explanation: 'A bundle is a single file you can copy over USB or email to an air-gapped machine, then `git clone repo.bundle` or `git pull` from it like any remote: history and branches intact, no server needed.'
  tags: [git]
- date: 2026-06-28
  tip: 'Use `match.arg()` to validate a function''s string argument against allowed values in R.'
  explanation: 'With `f <- function(type = c("a", "b", "c"))`, a call to `type <- match.arg(type)` defaults to the first option, allows partial matching, and throws a clear error on anything else: no manual `if`/`stop()` checks needed.'
  tags: [rstats, defensive-programming]
- date: 2026-06-29
  tip: 'Use `ssh -J me@gateway.example.edu me@compute01` to reach an internal host via a gateway.'
  explanation: 'The gateway is a public "jump host" fronting machines like `compute01` that you cannot SSH to directly. `-J` does not run a second `ssh` on the gateway; your client opens a TCP tunnel through it and authenticates to `compute01` itself, so your key never sits on the gateway. Make it permanent with a `ProxyJump gateway.example.edu` line under a `Host compute01` block in `~/.ssh/config`.'
  tags: [linux, ssh]
- date: 2026-06-30
  tip: 'A worktree lets two branches'' files exist on disk at once; `git switch` only keeps one.'
  explanation: 'A single worktree holds one branch''s files at a time, and switching overwrites them (the other versions stay only as compressed snapshots inside `.git`). `git worktree add site gh-pages` extracts a second branch into its own directory, so both branches'' files are usable at the same time without switching: handy when a build or test runs on one branch while you edit another. The worktrees share one `.git`, so it is not a clone.'
  tags: [git]
- date: 2026-07-01
  tip: 'If `quarto publish gh-pages` fails with "already checked out", run `git worktree prune`.'
  explanation: '`quarto publish gh-pages` builds the site in a temporary git worktree (under `.quarto/`) and removes it afterwards; an interrupted publish can leave a stale worktree registration that blocks the next run, which `git worktree prune` clears.'
  tags: [quarto, git]
- date: 2026-07-02
  tip: 'Use `ss -tulpn` to see which processes are listening on which ports.'
  explanation: 'The flags are the first letters of what you want, TCP, UDP, listening, process, and numeric, which conveniently spell "tulpn" (like the flower "tulip"). `ss` is the modern `netstat`, and the same `-tulpn` works for both; run with sudo to see every process.'
  tags: [linux, sysadmin]
- date: 2026-07-03
  tip: 'Press `q:` in Vim to open an editable window of your command history.'
  explanation: 'The command-line window shows past `:` commands as a normal buffer: edit any line with Vim motions and press Enter to run it (use `q/` for search history). If you open it by accident, `:q` closes it.'
  tags: [vim]
- date: 2026-07-04
  tip: 'Get an image''s pinnable digest with `docker inspect --format ''{{index .RepoDigests 0}}'' ubuntu:24.04`.'
  explanation: 'This prints the `name@sha256:...` reference for an image you have already pulled, so you can copy the exact digest into a `FROM` line or `docker pull` without hunting for the hash. (`docker images --digests` lists them too.)'
  tags: [docker, best-practice]
- date: 2026-07-05
  tip: 'Use Simon Willison''s `llm` CLI to query language models from the terminal.'
  explanation: 'After `pip install llm` and `llm keys set openai`, run `llm "question"` or pipe input with a system prompt, e.g. `cat script.R | llm -s "explain this code"`; use `-m` to switch models (plugins like `llm-anthropic` or `llm-ollama` add Claude and local models), and every prompt is logged to a SQLite database you can query with `llm logs`.'
  tags: [shell, llm]
- date: 2026-07-06
  tip: "`nextflow run main.nf -process.errorStrategy 'ignore'`"
  explanation: 'The `-process.<directive>` flag overrides a process directive for every process in this run; `errorStrategy ''ignore''` lets the pipeline skip failed tasks and keep going instead of terminating (the default), which is handy for getting partial results across many samples. Note that `workflow.failOnIgnore = true` can still make the run exit non-zero.'
  tags: [nextflow]
- date: 2026-07-07
  tip: '`pysradb metadata --saveto metadata.csv $(cat ids.txt)`'
  explanation: 'Use `pysradb` (install with `pip install pysradb`) to fetch SRA/ENA metadata straight from accession IDs (`ids.txt`) and `--saveto` writes a tidy table of sample, library and run fields to CSV.'
  tags: [bioinformatics, shell]
- date: 2026-07-08
  tip: 'Find just the files a process has open for writing with `sudo lsof -p <PID> | grep -E ''\s[0-9]+[wu]\s''`.'
  explanation: 'The FD column from `lsof` shows the numeric file descriptor that the process uses to refer to each open file, suffixed with its access mode: `r` read, `w` write, `u` read/write. `[0-9]+` matches only these real numbered descriptors and `[wu]` keeps just those open for writing, pinpointing which log or data file a runaway process is filling up.'
  tags: [linux, sysadmin]
- date: 2026-07-09
  tip: 'Use `tailscale up --exit-node=<node>` to route all your internet traffic through another machine on your tailnet.'
  explanation: 'An exit node acts like a personal VPN gateway: advertise one with `tailscale up --advertise-exit-node`, approve it in the admin console, then any device can send its full traffic through it.'
  tags: [networking]
- date: 2026-07-10
  tip: 'In Quarto, add `#| layout-ncol: 3` to a code chunk to lay three plots out side by side on one row.'
  explanation: 'Quarto arranges the figures a chunk produces into a grid; `layout-ncol: 3` gives three equal-width columns, so three `plot()` calls (or images) sit on the same row instead of stacking vertically. Pair it with `fig-cap` subcaptions, or use `layout-nrow` / a nested `layout` for finer control over the arrangement.'
  tags: [quarto]
- date: 2026-07-11
  tip: 'In Vim, put the cursor inside an HTML/XML element and press `cit` to change its contents.'
  explanation: 'A tag is the `<p>...</p>` style markup that wraps content in HTML or XML: an opening `<p>` and a closing `</p>` with text between them. `cit` ("change inside tag") deletes everything between the surrounding open and close tags and drops you into insert mode, leaving the tags themselves untouched; `dit` deletes it and `yit` yanks it.'
  tags: [vim]
- date: 2026-07-12
  tip: 'In Vim, `:g/pattern/d` deletes every line matching a pattern; `:g/pat/normal @a` runs a macro on each.'
  explanation: 'The `:global` command finds every matching line and runs an Ex command on it. `:g/DEBUG/d` strips all debug lines, `:v/keep/d` (inverse) deletes lines *not* matching, and `:g/pat/normal ...` fires any normal-mode sequence at each hit: a mini batch processor.'
  tags: [vim]
- date: 2026-07-13
  tip: 'With edgeR you can still test two conditions when only one has replicates, because the GLM estimates dispersion from residual degrees of freedom.'
  explanation: 'edgeR needs to estimate the negative-binomial dispersion (biological variability), which normally requires replication. But `estimateDisp` followed by `glmQLFit`/`glmFit` gets its residual df from *any* replicated group: with, say, 3 treated and 1 control sample, the 3 treated replicates supply the dispersion, which is then shared across all samples and genes, so the contrast is still testable.'
  tags: [bioinformatics, rstats]
- date: 2026-07-14
  tip: 'To pseudobulk scRNA-seq for edgeR, *sum* (do not average) raw counts across the cells of each sample x cell-type, then run the standard bulk pipeline.'
  explanation: 'Summing integer counts preserves the negative-binomial mean-variance relationship edgeR assumes; averaging or using normalized/log values breaks it. `scuttle::aggregateAcrossCells()` or `Seurat::AggregateExpression()` builds the matrix, which you then feed to `DGEList()`.'
  tags: [bioinformatics, rstats]
- date: 2026-07-15
  tip: 'Beware the "Google effect": you remember less of what you know you can look up later, storing *where* to find it instead of the fact itself.'
  explanation: 'Sparrow, Liu & Wegner (2011, Science) showed people recall information more poorly when told it will be saved and retrievable, treating the computer as a transactive-memory partner (Wegner''s term for offloading memories to others). Useful to know when deciding what is worth committing to memory versus a note.'
  tags: [self-help, learning]
- date: 2026-07-16
  tip: 'Beware "metacognitive laziness": leaning on an LLM can offload not just the work but the thinking about how well you are doing it.'
  explanation: 'Fan et al. (2025, British Journal of Educational Technology) found students using ChatGPT engaged in fewer metacognitive processes (evaluation, monitoring) and, while their essays improved most, showed no better knowledge gain or transfer than other groups. Do the planning and self-checking yourself even when the LLM does the drafting.'
  tags: [self-help, learning]
- date: 2026-07-17
  tip: 'Exploit the "generation effect": you remember material far better when you produce it yourself.'
  explanation: 'Slamecka & Graf (1978, Journal of Experimental Psychology: Human Learning and Memory) showed self-generated answers are recalled better than ones simply read.'
  tags: [self-help, learning]
- date: 2026-07-18
  tip: 'Add `truecolor on` to your `.screenrc` to enable 24-bit colour in GNU Screen 5.0.'
  explanation: 'The 5.0 series added the `truecolor [on|off]` command, so programs emitting 24-bit colour escapes (modern Neovim themes, `bat`, `delta`) render their full palette inside `screen` instead of being clamped to 256 colours.'
  tags: [screen]
- date: 2026-07-19
  tip: 'In Neovim 0.10+, toggle comments with `gcc` (current line) or `gc` over a motion/selection.'
  explanation: 'Built-in commenting landed in Neovim 0.10, using each language''s `commentstring`, so `gcip` comments a paragraph and `gc` in Visual mode toggles the selection; no Comment.nvim plugin needed.'
  tags: [vim]
- date: 2026-07-20
  tip: 'Read and send email without leaving the terminal using [aerc](https://aerc-mail.org/): it composes messages in your own `$EDITOR`.'
  explanation: 'aerc (created by Drew DeVault) is a keyboard-driven TUI mail client that drops you into Vim (or whatever `$EDITOR` is set to) to write the body, so you get syntax highlighting, macros, and spell-check for free before hitting `:send`.'
  tags: [email]
- date: 2026-07-21
  tip: 'On Apple Silicon, create a macOS VM in [UTM](https://mac.getutm.app/) via `Create a New Virtual Machine` -> `Virtualize` -> `macOS`, which is useful for testing.'
  explanation: 'UTM wraps Apple''s Virtualization.framework, so on an M-series Mac it spins up a near-native macOS guest from an Apple-signed restore image.'
  tags: [macos]
- date: 2026-07-22
  tip: 'Run `btop` for a modern, mouse-driven resource monitor that replaces `top` and `htop`.'
  explanation: '[btop](https://github.com/aristocratos/btop) shows CPU, memory, disks, network, and processes in one colourful TUI with clickable menus and per-core graphs; install it via `apt`, `brew`, or `snap`.'
  tags: [linux, sysadmin]
- date: 2026-07-23
  tip: 'Run `dust` for an intuitive `du`: it prints a coloured tree of your biggest directories with percentage bars, no flags needed.'
  explanation: '[dust](https://github.com/bootandy/dust) (du + Rust) auto-sizes to your terminal and sorts largest-first, so you spot what is eating disk instantly instead of parsing `du -h | sort -h`.'
  tags: [shell]
- date: 2026-07-24
  tip: 'Use `yazi` as a terminal file navigator; uses Vim keybindings to move between files and directories, and provides a nice preview of files.'
  explanation: '[yazi](https://yazi-rs.github.io/) is a blazing fast terminal file manager written in Rust, based on async I/O.'
  tags: [shell]
- date: 2026-07-25
  tip: 'Run SQL straight over a CSV or Parquet file with `duckdb -c "SELECT * FROM ''data.csv'' LIMIT 5"`.'
  explanation: '[DuckDB](https://duckdb.org/)''s replacement scans treat a file path in the `FROM` clause as a table, so you can join a CSV to a Parquet file to a JSON file in one query without ever creating a database.'
  tags: [sql]
- date: 2026-07-26
  tip: 'Read JSON into R with `jsonlite::fromJSON("data.json", flatten = TRUE)`.'
  explanation: 'Jeroen Ooms'' [jsonlite](https://jeroen.r-universe.dev/jsonlite) simplifies an array of objects straight into a data frame, and `flatten = TRUE` unpacks nested data frame columns into plain `user.profile.email` style columns.'
  tags: [rstats, file-formats]
- date: 2026-07-27
  tip: 'On Windows, run Ubuntu inside Warp via `Settings` -> `Features` -> `Session` -> `Startup shell for new sessions`.'
  explanation: 'Warp for Windows defaults to PowerShell 7, but selecting your WSL2 distro there gives you bash and the full Linux toolchain with Blocks and Agent Mode still working; the change applies only to sessions opened afterwards.'
  tags: [terminal, windows]
- date: 2026-07-28
  tip: 'Pipe output to the system clipboard with `xclip -selection clipboard`.'
  explanation: 'Without `-selection clipboard`, `xclip` writes to the X primary selection, which only pastes with a middle-click; alias it as `alias xc=''xclip -selection clipboard''` so `ls | xc` then `Ctrl-V` just works.'
  tags: [shell, linux]
- date: 2026-07-29
  tip: 'Declare a Python script''s dependencies inline with a PEP 723 block that opens with `# /// script` and closes with `# ///`, then run it with `uv run script.py`.'
  explanation: 'Each line between the delimiters is TOML written as a `#` comment, such as `# dependencies = ["pandas"]`; `uv run` builds a throwaway environment with exactly those packages, so the script stays a single shareable file with no `requirements.txt`.'
  tags: [python]
- date: 2026-07-30
  tip: 'Pass a function itself to `deparse()` to get its source code back as text you can search.'
  explanation: '`deparse(stats::lm)` returns the function definition as a character vector, one element per line, so `grep("qr", deparse(stats::lm), value = TRUE)` pulls out just the lines you care about.'
  tags: [rstats]
- date: 2026-07-31
  tip: 'Run a local LLM on Apple Silicon with `pip install mlx-lm` then `mlx_lm.generate --model mlx-community/Mistral-7B-Instruct-v0.3-4bit --prompt "How tall is Mt Everest?"`.'
  explanation: 'MLX is Apple''s array framework built on Metal; `mlx_lm` pulls the weights from Hugging Face on first use, and the `mlx-community` org hosts pre-quantized 4-bit conversions that fit comfortably in unified memory.'
  tags: [macos, llm]
- date: 2026-08-01
  tip: 'Serve a local MLX model behind an OpenAI-compatible API with `mlx_lm.server --model mlx-community/Mistral-7B-Instruct-v0.3-4bit`.'
  explanation: 'It listens on `http://localhost:8080/v1`, so any OpenAI client works by pointing `base_url` there with a dummy `api_key`, letting you drop a local Mac model into code already written against the OpenAI SDK.'
  tags: [macos, llm]
- date: 2026-08-02
  tip: 'Bind-mount as yourself with `docker run --user $(id -u):$(id -g) -v "$PWD":/work -w /work <image>`.'
  explanation: 'Anything the container writes into `/work` then belongs to you on the host instead of `root`, which saves needing `sudo` to delete your own output files.'
  tags: [docker]
- date: 2026-08-03
  tip: 'The routing table is the kernel''s list of "packets for X go out door Y" rules; see yours with `ip route`.'
  explanation: 'Every outgoing packet is checked against it and the most specific matching prefix wins: `192.168.1.0/24 dev eth0` takes LAN traffic while `default via 192.168.1.1` catches everything else. Use `ip route get 1.1.1.1` to see which rule a given destination actually matches.'
  tags: [linux, networking]
- date: 2026-08-04
  tip: 'On macOS, drop an executable `/etc/ppp/ip-up` script to run commands automatically the moment a VPN tunnel comes up.'
  explanation: '`pppd` executes it as root once the L2TP link can pass IP packets, which is the classic place to add split-tunnel routes: `/sbin/route add -net 10.0.0.0/8 -interface "$1"`. Untick "Send all traffic over the VPN connection" in the VPN settings and let this script add only the routes you actually want.'
  tags: [macos, networking]
- date: 2026-08-05
  tip: 'Set `freeze: auto` under `execute:` in `_quarto.yml` so Quarto only re-runs a document''s code when that document changes.'
  explanation: 'Results are stored under `_freeze/`; commit that directory and the site rebuilds (including in CI, where R or Python may not even be installed) without re-executing expensive chunks. Use `freeze: true` to never re-execute during a project render.'
  tags: [quarto]
- date: 2026-08-06
  tip: 'Write a cache file to `paste0(f, ".tmp")` and then `file.rename()` it into place so an interrupted write never leaves a corrupt `f`.'
  explanation: 'Renaming is a single atomic operation, so readers see either the old file or the complete new one and never a half-written one: `saveRDS(list(key = key, result = res), tmp); file.rename(tmp, f)`. An aborted render leaves a stray `.tmp` you can delete rather than a poisoned cache entry that silently returns garbage.'
  tags: [rstats, best-practice]
- date: 2026-08-07
  tip: 'Pair every `tmp <- tempfile()` inside an R function with `on.exit(unlink(tmp), add = TRUE)` on the very next line.'
  explanation: 'The expression is stored and only evaluated when the function exits, by any route (normal return, `stop()`, or a `Ctrl-C` interrupt) so a failed run never leaves the temporary file behind and the body needs no `tryCatch()` wrapper. Always pass `add = TRUE`, because the default replaces whatever an earlier `on.exit()` call registered rather than adding to it.'
  tags: [rstats, defensive-programming]
- date: 2026-08-08
  tip: 'The Wasserstein-2 distance ($W_2$) is the minimum cost of reshaping one distribution into another, where cost is mass moved times distance squared.'
  explanation: 'Hence its nickname, the earth mover''s distance: picture each distribution as a pile of dirt and ask for the cheapest transport plan between them. Unlike pointwise measures it cares _how far_ mass has to travel, so two histograms that never overlap still get a finite, meaningful distance.'
  tags: [statistics]
- date: 2026-08-09
  tip: 'In fzf, prefix a term with `''` for an exact match, `^`/`$` to anchor it, and `!` to exclude it.'
  explanation: 'Space-separated terms are ANDed and `|` ORs them, so `^src .go$ | .rs$ !test` finds Go or Rust files under `src` while dropping anything with "test" in the path. Fuzzy matching is the default, but these operators let you tighten a noisy list without leaving the prompt.'
  tags: [shell]
- date: 2026-08-10
  tip: 'When using oh-my-zsh add `fzf` to `plugins=()` in `~/.zshrc` and its keybindings are set up for you.'
  explanation: 'The plugin finds your fzf install and sources its `key-bindings.zsh` and `completion.zsh`, giving you `Ctrl-T` to paste fuzzy-picked file paths onto the command line, `Ctrl-R` for fuzzy history search, and `Alt-C` to cd into a subdirectory.'
  tags: [zsh]
- date: 2026-08-11
  tip: 'Stop work while it is still going well and you know exactly what comes next.'
  explanation: 'Hemingway''s rule from Esquire in 1935: "always stop when you are going good and when you know what will happen next... you will never be stuck." This gets sold as the Zeigarnik effect, but a 2025 meta-analysis found no recall advantage for unfinished tasks; what held up was the lesser-known Ovsiankina effect, a pull to spontaneously resume an interrupted task in roughly two-thirds of cases.'
  tags: [self-help]
- date: 2026-08-12
  tip: 'An NVMe "bad sector" is a logical error, not physical damage; overwrite the LBA and it is fixed.'
  explanation: 'A bad sector on a hard disk is physically damaged platter: gone for good. An LBA (Logical Block Address) is just the numbered slot the OS asks for, and NVMe keeps that slot wherever it likes in flash, so a read failure is merely logical: error correction gave up and the LBA is flagged as holding nothing valid. Rewriting it binds the slot to a good page and clears the flag: `sudo nvme write-zeroes /dev/nvme0n1 -s <lba> -c 0`.'
  tags: [linux, sysadmin]
- date: 2026-08-13
  tip: 'Run `duf` instead of `df -h`: it groups mounts into local, network, and special devices with colour-coded usage bars.'
  explanation: '[duf](https://github.com/muesli/duf) (Disk Usage/Free) hides the pseudo-filesystem noise `df` dumps on you by default and colours each bar green/yellow/red by how full it is.'
  tags: [shell]
- date: 2026-08-14
  tip: 'Find a specific email in aerc with `:search -f alice -b invoice`, then jump between the hits with `:next-result`.'
  explanation: 'Search flags stack: `-f` sender, `-t` recipient, `-c` cc, `-b` body, `-a` the entire message, `-H Subject:report` a named header, `-u`/`-r` unread/read, and `-d 1w` or `-d 2026-01-01..2026-02-01` a date range. Run the same query with `:filter` instead and aerc hides every message that does not match rather than merely highlighting the ones that do.'
  tags: [email]
- date: 2026-08-15
  tip: 'Before calling a system automated, ask who labelled the data.'
  explanation: 'For Empire of AI, Karen Hao interviewed the Kenyan workers OpenAI contracted through Sama from November 2021 to build the toxicity detector that shipped in ChatGPT, classifying not just the worst text on the internet but worse that OpenAI prompted its own models to invent. TIME put their take-home pay at $1.32 to $2 an hour against the $12.50 OpenAI paid Sama, and the contract ended eight months early with workers describing lasting trauma.'
  tags: [llm, economics]
- date: 2026-08-16
  tip: 'Treat a model''s headline benchmark scores as vendor-reported until something independent confirms them.'
  explanation: 'Stanford''s AI Index 2026 found industry produced over 90% of notable AI models in 2025, and that almost all frontier developers publish capability numbers like MMLU and SWE-bench while reporting against responsible AI benchmarks stays sparse. Karen Hao calls this the empire''s knowledge monopoly in Empire of AI: the firms building the systems supply most of the evidence about them. Reach for a third-party evaluation such as HELM or a live Arena leaderboard before repeating a number.'
  tags: [llm, best-practice]
- date: 2026-08-17
  tip: 'Favour work whose output is non-rival: my copy does not consume yours.'
  explanation: 'Non-rivalry of ideas is the core assumption of Paul Romer''s endogenous growth theory, the work behind his 2018 economics Nobel: your use of an idea does not subtract from mine, so one idea can serve any number of people at once and gives increasing returns to scale in a way that land and labour cannot. That is the test for your own output: one tutorial serves the thousandth reader as fully as the first, while your hour of troubleshooting goes to one person and nobody else can have it.'
  tags: [economics]
- date: 2026-08-18
  tip: 'When you cannot coordinate explicitly, pick the option the other side would guess.'
  explanation: 'Thomas Schelling called these focal points: asked where they would meet a stranger in New York with no time or place agreed, most of his subjects chose the information booth at Grand Central, and almost all said noon. It is why a team with no naming convention still converges on `main.py`, and why an obvious default beats a better option nobody would predict.'
  tags: [economics]
- date: 2026-08-19
  tip: 'Run `nvtop` for an htop-style view of GPU utilisation, memory and the processes using them.'
  explanation: 'Handles NVIDIA, AMD and Intel GPUs out of the box, plotting per-GPU utilisation and memory over time above a process list showing which PIDs hold GPU memory. Packaged as `nvtop` on Debian buster and Ubuntu 21.10 or newer.'
  tags: [gpu, linux]
- date: 2026-08-20
  tip: 'Set container environment variables in `%environment`, not `%post`.'
  explanation: '`%post` runs once at build time, so an `export` there has vanished by the time anyone runs the container; put it in `%environment`, which is evaluated at runtime, or append the line to `$SINGULARITY_ENVIRONMENT` from inside `%post`.'
  tags: [singularity]
- date: 2026-08-21
  tip: 'Sign a container with `singularity key newpair` then `singularity sign my_image.sif`.'
  explanation: '`key newpair` creates a PGP keypair under `~/.singularity/sypgp` and `sign` writes the signature into the SIF itself, so there is no detached `.sig` file to lose. Export the public half with `singularity key export -a ./public.asc`, carry it across with the image, and the far side runs `singularity key import ./public.asc` before `singularity verify my_image.sif`.'
  tags: [singularity, security]
- date: 2026-08-22
  tip: 'Re-wrap a long line to a fixed width with `fold -w 60 file.txt`.'
  explanation: 'It splits at 80 columns by default and never joins lines, so it is the quick way to re-wrap FASTA sequence or make a one-line file diffable; `-s` prefers breaking at spaces, though a word longer than the width still gets chopped. Use `fmt` for prose, since it reflows whole paragraphs instead of just counting columns.'
  tags: [shell]
- date: 2026-08-23
  tip: 'Point `SINGULARITY_CACHEDIR` at scratch space before pulling large images.'
  explanation: 'Pulls cache their layers under `~/.singularity/cache` by default, which quietly eats an HPC home quota after a few Docker conversions. Check what is there with `singularity cache list -v` and reclaim it with `singularity cache clean`.'
  tags: [singularity, hpc]
- date: 2026-08-24
  tip: 'Make a script a service by dropping a unit at `/etc/systemd/system/diskcheck.service` with `Type=oneshot`, then run `sudo systemctl daemon-reload`.'
  explanation: 'A minimal unit needs only `[Unit] Description=`, `[Service] Type=oneshot` and `ExecStart=/usr/local/bin/diskcheck.sh`; `Type=oneshot` tells systemd the process is meant to exit rather than stay resident, so it is not flagged as a failed daemon. `ExecStart` needs an absolute path and does not run through a shell, so pipes and globs must be wrapped in `/bin/bash -c`.'
  tags: [linux, systemd]
- date: 2026-08-25
  tip: 'Schedule a `oneshot` service with a matching `.timer` unit and `OnCalendar=daily`, then enable the timer, not the service.'
  explanation: 'Create `diskcheck.timer` with `[Timer] OnCalendar=daily`, `Persistent=true` and `[Install] WantedBy=timers.target`, then `sudo systemctl enable --now diskcheck.timer`; `Persistent=true` catches up on a run missed while the machine was off, which plain `cron` never does. Check the next firing with `systemctl list-timers --all`.'
  tags: [linux, systemd]
- date: 2026-08-26
  tip: 'Prospect theory: people judge outcomes as gains and losses from a reference point, not as final states of wealth.'
  explanation: 'In Kahneman and Tversky''s 1979 *Econometrica* paper, the work behind Kahneman''s 2002 economics Nobel, 80% of subjects chose a sure 3,000 over an 80% chance of 4,000; when the same numbers were mirrored into losses, a sure loss of 3,000 against an 80% chance of losing 4,000, 92% took the gamble. Identical arithmetic, opposite risk appetite: all that changed was which side of the reference point the outcomes sat on.'
  tags: [economics, decision-making]
- date: 2026-08-27
  tip: 'Wrap scratch work in `local({ ... })` so only the result escapes and the temporary names never reach your global environment.'
  explanation: '`local()` evaluates the block in a fresh environment and returns its last expression, so `dat <- local({ tmp <- readr::read_csv("raw.csv"); dplyr::filter(tmp, ok) })` leaves `dat` behind and discards `tmp`. Name lookup still falls through to the caller, so everything you already have loaded stays visible inside the block.'
  tags: [rstats]
- date: 2026-08-28
  tip: 'Use `tea`, the Gitea CLI, as the `gh` equivalent for self-hosted Gitea and Forgejo servers.'
  explanation: '`gh` only speaks the GitHub API, but Forgejo implements the Gitea API, so one tool covers both: `tea login add --name work --url https://git.example.com --token <PAT>` registers an instance, after which `tea repos ls`, `tea issues ls` and `tea pr create` work against it.'
  tags: [git]
- date: 2026-08-29
  tip: 'Keep a token in a file and pass it with command substitution: `tea login add --token "$(cat ~/.gitea_pat)"`.'
  explanation: 'The shell expands `$(cat ...)` before running the command, so your history records the literal text `$(cat ~/.gitea_pat)` and never the token itself; `chmod 600 ~/.gitea_pat` keeps the file readable only by you. Always quote the substitution so a stray newline or space cannot split it into two arguments.'
  tags: [shell, security]
- date: 2026-08-30
  tip: 'Tag repositories with GitHub topics, then find them again with `gh repo list --topic`.'
  explanation: 'Topics are repository-level labels, added from the "About" panel on the repository''s GitHub page or with `gh repo edit --add-topic rnaseq`, and `gh repo list davetang --topic rnaseq --limit 100` filters on them, which beats trying to encode categories in repository names. Repeat `--topic` to require several at once.'
  tags: [git]
- date: 2026-08-31
  tip: 'Pipe `gh repo list --json` through `--jq` to bulk clone: `gh repo list davetang --topic rnaseq --json nameWithOwner --jq ".[].nameWithOwner" | xargs -n1 gh repo clone`.'
  explanation: 'Any `gh` command that accepts `--json` also accepts `--jq`, so the filtering happens inside `gh` with no separate `jq` install; `xargs -n1` then hands each `owner/repo` to `gh repo clone` one at a time. Add `--limit 100` because the default caps the list at 30.'
  tags: [git]
- date: 2026-09-01
  tip: 'Start a project skeleton on Gitea or Forgejo with `tea repos create --name rnaseq-skeleton --init --template`.'
  explanation: 'The `--init` flag asks the server for an initial commit so the repo is not empty, and `--template` sets the template bit that makes it selectable by `tea repos create-from-template`; you then clone it and push the skeleton files themselves. Add `--license mit --gitignores R` to have those seeded in the first commit too.'
  tags: [git]
- date: 2026-09-02
  tip: 'Run `curl -sI https://example.com/` to see just the response headers, including `Server:`.'
  explanation: '`-I` sends a `HEAD` request so you get headers without the body, and `-s` silences the progress meter. The `Server:` line usually names the software outright, such as `nginx/1.24.0` or `Apache/2.4.58 (Ubuntu)`, which settles "is this nginx or Apache?" in one command.'
  tags: [linux, networking]
- date: 2026-09-03
  tip: 'Use docsify to publish a folder of Markdown files as a documentation site with no build step.'
  explanation: 'A docsify site is a single `index.html` that loads the library from a CDN and fetches your `.md` files in the browser at runtime, so there is no generated HTML to commit.'
  tags: [markdown]
- date: 2026-09-04
  tip: 'In Inkscape, press `Shift+Ctrl+R` to resize the page to fit your drawing, or to fit only the objects you have selected.'
  explanation: 'Press `Escape` first to deselect everything if you want the page to hug the whole canvas, or select specific objects to crop to just those. The same action lives in Document Properties (`Shift+Ctrl+D`) under the Page tab, in the "Resize page to content" section. On macOS use `Cmd` in place of `Ctrl`.'
  tags: [graphics]
- date: 2026-09-05
  tip: 'Wrap a command that is allowed to fail in `set +e` and `set -e` to keep the rest of the script under `errexit`.'
  explanation: 'Capture the status immediately after the command, before anything else overwrites `$?`: `set +e; grep -q pattern file; rc=$?; set -e`. Without the toggle, `set -e` kills the script the moment `grep` finds nothing.'
  tags: [bash, scripting]
- date: 2026-09-06
  tip: 'Add your own tldr pages by dropping a `<command>.page.md` file into the tealdeer custom pages directory.'
  explanation: 'Run `tldr --show-paths` to find the directory, then write your own page for an in-house script. A `<command>.patch.md` file instead appends your extra examples to the official page rather than replacing it.'
  tags: [shell]
- date: 2026-09-07
  tip: 'Pipe `tldr --list` into `fzf` to browse every cached tldr page: `tldr --list | fzf | xargs tldr`.'
  explanation: '`--list` prints every page available for your platform, so fuzzy-finding it turns tealdeer into a searchable catalogue of commands you did not know existed.'
  tags: [shell]
- date: 2026-09-08
  tip: 'File descriptor 3 is just the first number the shell has not already reserved: `exec 3>notes.txt` turns `>&3` into your own output stream.'
  explanation: 'Every process starts with 0, 1 and 2 wired to stdin, stdout and stderr, which is why `2>&1` reads as "point 2 at whatever 1 is". Nothing is special about those numbers, so once you open 3 yourself, `echo done >&3` writes to `notes.txt` while stdout and stderr carry on untouched.'
  tags: [shell, bash]
- date: 2026-09-09
  tip: 'Use `parallelly::availableCores()` rather than `parallel::detectCores()` to decide how many workers to start.'
  explanation: '`detectCores()` reports the physical machine, so inside a container or a Slurm/SGE allocation it happily returns 96 on a node where you were granted 4, and you oversubscribe the CPU or get killed. `availableCores()` honours cgroup quotas and scheduler variables such as `NSLOTS` and `SLURM_CPUS_PER_TASK`, which is why {future} uses it internally.'
  tags: [rstats, parallel, hpc]
- date: 2026-09-10
  tip: 'Run `ssh -L 8787:localhost:8787 user@server` and open `http://localhost:8787` to use a remote RStudio as if it were local.'
  explanation: 'The `localhost` in the middle is resolved by the *server*, not by you: your client listens on local port 8787 and the far end connects to its own 8787. Make it permanent with a `LocalForward 8787 localhost:8787` line under the matching `Host` block in `~/.ssh/config`.'
  tags: [linux, ssh]
- date: 2026-09-11
  tip: 'Build an MCP server in Python with `from mcp.server import MCPServer`, then decorate a type-hinted function with `@mcp.tool()`.'
  explanation: 'The signature is the schema: `def add(a: int, b: int) -> int` plus a docstring gives the tool its JSON Schema, its description and its structured output, so you write no schema, no request parsing and no validation. Install with `pip install "mcp[cli]"`.'
  tags: [python, llm]
- date: 2026-09-12
  tip: 'Call `reticulate::py_require("polars")` near the top of a Quarto doc instead of pre-building a virtualenv.'
  explanation: 'Since reticulate 1.41 the declared packages are resolved with `uv` into an ephemeral environment on first use, so the `.qmd` carries its own Python dependencies and a colleague renders it without any setup step. `py_require(python_version = "3.12")` pins the interpreter the same way.'
  tags: [quarto, python]
- date: 2026-09-13
  tip: 'Put a `.dockerignore` in the root of your build context so `docker build .` stops shipping `.git`, `.env` and data files to the builder.'
  explanation: 'Everything in the context is sent before the first instruction runs, and anything `COPY . .` picks up can bust the cache or leak into the image. Unlike `.gitignore`, patterns are anchored to the context root, so `*.bam` only matches top-level files; write `**/*.bam` to match everywhere.'
  tags: [docker, best-practice]
- date: 2026-09-14
  tip: 'Loop over files with `for file in *.pdf; do ...; done` instead of `for file in $(ls *.pdf)`.'
  explanation: 'The shell splits the output of `$(ls ...)` on spaces, tabs and newlines, so `My Report.pdf` arrives as `My` and `Report.pdf`; a glob expands straight into one word per filename. Keep `"$file"` quoted inside the loop or the name gets split again.'
  tags: [shell, bash, best-practice]
- date: 2026-09-15
  tip: 'Write `rm -rf "${dir:?}/"*` instead of `rm -rf "$dir/"*`, so the script stops if `dir` is empty rather than deleting everything under `/`.'
  explanation: 'This is the same parameter expansion family as `${dir:-default}`: where `:-` swaps in a default value when `dir` is unset or empty, `:?` swaps in an error, printing `dir: parameter null or not set` and exiting the script before `rm` ever runs.'
  tags: [shell, bash, best-practice]
- date: 2026-09-16
  tip: 'Migrate a repo with `git clone --mirror`, then `git push --all` and `git push --tags` to the new host.'
  explanation: 'A plain `git clone` makes a local branch only for the default branch, and `git push --all` pushes local branches, so you would move `main` and nothing else; in a mirror clone every branch is local, so `--all` really does move them all.'
  tags: [git]
- date: 2026-09-17
  tip: 'Record provenance in a Singularity image with a `%labels` section, then read it back with `singularity inspect --labels my_image.sif`.'
  explanation: 'Each line splits at the first space into a name and a value, so `Author me@example.com` and `Version v1.0.0` become two labels. They are written to `/.singularity.d/labels.json` inside the SIF, so the metadata travels with the image instead of living in a README that goes missing.'
  tags: [singularity]
- date: 2026-09-18
  tip: 'Put `source ~/miniforge3/etc/profile.d/conda.sh` at the top of a script before any `conda activate`.'
  explanation: '`conda activate` is a shell function, not the `conda` executable on `PATH`, so a non-interactive script fails with `CommandNotFoundError: Your shell has not been properly configured`. Bash only reads `~/.bashrc` for interactive shells, so the `conda init` block there never runs under cron, `sbatch`, or `bash script.sh`.'
  tags: [shell, conda]
- date: 2026-09-19
  tip: 'Guess PowerShell commands from the `Verb-Noun` pattern: `Get-Process`, `Stop-Process`, `Start-ScheduledTask`.'
  explanation: 'Cmdlets are not programs on a `PATH` but a small vocabulary of approved verbs glued to a noun, so knowing `Get-Content` means you can usually guess `Set-Content`. Names and parameters are case-insensitive, and tab completion finishes both.'
  tags: [powershell, windows]
- date: 2026-09-20
  tip: 'In PowerShell, pick fields with `Select-Object Name,Id` instead of reaching for `awk` or `cut`.'
  explanation: 'A PowerShell pipeline carries objects rather than lines of text, so `Get-Process | Select-Object Name,Id` replaces `ps | awk ''{print $1,$2}''` and you name properties instead of counting columns. For the same reason `Where-Object` takes over from `grep` on command output.'
  tags: [powershell, windows]
- date: 2026-09-21
  tip: 'Run a quoted program path in PowerShell with the call operator: `& "C:\Program Files\App\tool.exe" --uninstall`.'
  explanation: 'A quoted string on its own is just a string, so PowerShell either prints it or fails on the arguments with `Unexpected token`; `&` says "run this".'
  tags: [powershell, windows]
- date: 2026-09-22
  tip: 'Run `sudo inxi -Fxxxz` for a one-screen hardware and system report that is safe to paste in public.'
  explanation: '`-F` gives the full set of sections (CPU, board, graphics, drives, network, sensors), `-xxx` adds three tiers of extra detail such as chip vendor IDs and RAM speed, and `-z` filters out serial numbers, MAC addresses and IP addresses, which is why distro forums and bug trackers ask for exactly this command.'
  tags: [linux, sysadmin]
- date: 2026-09-23
  tip: 'Upgrade Debian 12 to 13 in two passes: `sudo apt upgrade --without-new-pkgs` first, then `sudo apt full-upgrade`.'
  explanation: 'The first pass only upgrades packages that need no new dependencies and removes nothing, so fewer things change at once when the second pass does the heavy work. This is the order the Debian 13 release notes recommend, and it cuts down the chance of `apt` removing half your desktop to settle a conflict.'
  tags: [debian, sysadmin]
- date: 2026-09-24
  tip: 'Read HTML emails in aerc by adding `text/html=w3m -dump -T text/html -I utf-8 -O utf-8` under `[filters]` in `~/.config/aerc/aerc.conf`.'
  explanation: 'aerc sends each message part to the filter for its MIME type and shows the output. `-dump` makes w3m print rendered text instead of opening its browser, `-T text/html` tells it the input is HTML rather than plain text, and `-I`/`-O` set the input and output character sets to UTF-8.'
  tags: [email]
- date: 2026-09-25
  tip: 'Make a closed-source binary carry its own glibc with `patchelf --set-interpreter /opt/glibc-2.39/lib/ld-linux-x86-64.so.2 --set-rpath /opt/glibc-2.39/lib ./tool`.'
  explanation: 'The loader has to come along with `libc.so.6` because the two share `GLIBC_PRIVATE` internals and must come from the same build. If you point only the rpath at a newer libc, the old system `ld-linux` stays in charge and fails with a `GLIBC_PRIVATE` relocation error.'
  tags: [linux]
- date: 2026-09-26
  tip: 'Copy a rectangular block in GNU screen: `Ctrl-a [`, move to one corner, Space, `c`, move to the right edge, `C`, `j`/`k` to select lines, Space, then `Ctrl-a ]` to paste.'
  explanation: 'The first Space starts the mark, `c` fixes the left margin at the cursor column and `C` fixes the right margin, so the closing Space copies only the columns between the two margins on every marked line. Handy for grabbing a single column out of `ls -l` or `ps` output.'
  tags: [screen]
- date: 2026-09-27
  tip: 'Put `status top right` in your `.screenrc` so GNU screen messages stop covering your prompt.'
  explanation: 'Messages such as `Copy mode - Column 0 Line 0` or `Activity in window 2` normally overwrite the bottom-left corner, which is where your prompt usually sits. The `status` command, new in 5.0, moves them to any corner you choose with `top`/`bottom` plus `left`/`right`.'
  tags: [screen]
- date: 2026-09-28
  tip: 'Run `Ctrl-a :source ~/.screenrc` to apply `.screenrc` edits to a GNU screen session that is already running.'
  explanation: 'screen reads `.screenrc` only when a session starts, and reattaching with `screen -r` does not reload it, so a new line such as `status top right` does nothing in older sessions until you source the file. Every command in the file runs again, so any `screen -t name 0 cmd` lines will open extra windows.'
  tags: [screen]
- date: 2026-09-29
  tip: 'Run `docker run --rm -e TZ=Asia/Tokyo <image> date` to set a container''s timezone without rebuilding the image.'
  explanation: 'Containers default to UTC, and the C library reads the `TZ` variable at run time to look up the zone in `/usr/share/zoneinfo`, so the same image can show Tokyo time on one run and UTC on the next.'
  tags: [docker]
- date: 2026-09-30
  tip: 'Commit an empty directory by adding an empty `.gitkeep` file to it: `mkdir -p logs && touch logs/.gitkeep`.'
  explanation: 'Git tracks files, not directories, so an empty folder never appears in `git status` and is missing from every clone. `.gitkeep` is only a naming convention (Git gives it no special meaning), but the name tells readers why the file exists. To keep the folder while ignoring whatever lands in it, add `logs/*` and `!logs/.gitkeep` to `.gitignore`.'
  tags: [git]
- date: 2026-10-01
  tip: 'Use `git show HEAD` to show the changes in the latest commit; use `git show HEAD~1` for the second latest commit.'
  explanation: 'As written in `tldr`, `git show` shows information about a specific commit, tag, or branch (such as `HEAD` for the latest commit).'
  tags: [git]
- date: 2026-10-02
  tip: 'Add `-prune` after `-name` to list only the top-level matches: `find . -name "*proj*" -prune` prints `proj/` but nothing inside it.'
  explanation: '`-prune` tells `find` not to go into a directory that has just matched, so `proj/proj_old` and `proj/proj.txt` are skipped. It is also faster on large trees, because `find` never reads the contents of matched directories.'
  tags: [shell]
- date: 2026-10-03
  tip: 'Use `find / -name "*.conf" 2>&1 | grep -v ''Permission denied''` to hide permission errors but keep every other error.'
  explanation: '`2>/dev/null` throws away all of stderr, including useful messages like `No such file or directory` when a starting path has a typo. Merging stderr into stdout and removing only the `Permission denied` lines cuts the noise without hiding real problems.'
  tags: [shell]
- date: 2026-10-04
  tip: 'Give a tunnel its own `Host` entry in `~/.ssh/config` and open it with `ssh -fN myserver-web`, so it runs in the background without a shell.'
  explanation: 'The entry is `Host myserver-web` followed by two indented lines, `HostName server.example.org` and `LocalForward 8765 127.0.0.1:8765` (add `User` if your login name is different). `-N` runs no remote command and `-f` sends `ssh` to the background after it logs in, so only the forward is left running; close it with `pkill -f ''ssh -fN myserver-web''`.'
  tags: [linux, ssh]
- date: 2026-10-05
  tip: '`GITHUB_TOKEN=$(gh auth token)`'
  explanation: '`gh auth token` can automatically generate a GitHub token for you and you can use it with tools that read GITHUB_TOKEN.'
  tags: [git]
- date: 2026-10-06
  tip: 'When using splits in `nvim`, `:resize 20` will set height to 20 lines and `:vertical resize 80` will set width to 80 columns.'
  explanation: 'In Neovim, some plugins create splits that are either too big or small; use `:resize` and `:vertical resize` to adjust the horizontal and vertical splits, respectively.'
  tags: [vim]
- date: 2026-10-07
  tip: 'Delete several emails at once in aerc: press `Space` on each one to mark it, then `D` to delete them all.'
  explanation: '`Space` runs `:mark -t` then `:next`, so you can work down the list marking as you go, while `v` toggles the mark without moving. Commands like `:delete` act on every marked message instead of only the highlighted one, and `:unmark -a` clears the marks if you change your mind.'
  tags: [email]
- date: 2026-10-08
  tip: 'Add `-e TERM=xterm-256color` to `docker run -it` so programs in the container use 256 colours.'
  explanation: 'With `-t`, Docker sets `TERM=xterm`, which the terminfo database lists as 8 colours, so vim, htop and prompt themes look washed out. `tput colors` prints the colour count for the current `TERM`, so `docker run --rm -t debian tput colors` prints `8`, while adding `-e TERM=xterm-256color` makes it print `256`.'
  tags: [docker, terminal]
- date: 2026-10-09
  tip: 'Serve a folder of HTML with `python3 -m http.server 8765 --bind 127.0.0.1 --directory ~/project/docs`.'
  explanation: 'Without `--bind`, Python listens on every interface (`Serving HTTP on 0.0.0.0`), so anyone who can reach the machine can read the files. Everything under `--directory` is served, so never point it at your home directory.'
  tags: [python, networking]
- date: 2026-10-10
  tip: 'Run `quarto preview report.qmd --port 8765 --no-browser` on a remote machine and view it through an SSH tunnel.'
  explanation: 'Add `LocalForward 8765 127.0.0.1:8765` under the server''s `Host` entry in `~/.ssh/config`, and every `ssh myserver` forwards port 8765 on your machine to port 8765 on the server, so `http://localhost:8765` in your browser shows the preview. Without `--port`, Quarto picks a new random port every run (`4191`, then `6157`), which the tunnel never reaches. `--no-browser` stops it trying to open a browser on the server.'
  tags: [quarto, ssh]
- date: 2026-10-11
  tip: 'OSC (Operating System Command) is the `ESC ]` escape sequence that sends commands to the terminal itself.'
  explanation: 'An OSC sequence is `ESC ]`, a number that picks the command, a `;`, a text argument, then a terminator: BEL (`\a`) or `ESC \`. For example, `printf ''\e]2;build server\a''` sets the window title, OSC 8 makes clickable links and OSC 52 sets the clipboard. The name is historical: the ECMA-48 standard set it aside for "operating system use", and terminals now use it for features beyond drawing text.'
  tags: [terminal]
- date: 2026-10-12
  tip: 'Run `infocmp` to see the terminfo entry that full-screen programs load for your `$TERM`.'
  explanation: 'An escape code is a byte sequence starting with the Escape character (`\E`) that the terminal acts on instead of printing. Terminals differ in which codes they understand, so programs such as `less` and `vim` use the ncurses library to look up `$TERM` in the terminfo database rather than hard-coding them. `infocmp` prints that entry, where `clear=\E[H\E[2J` is the code that clears the screen.'
  tags: [terminal]
- date: 2026-10-13
  tip: 'Set `networkingMode=mirrored` in `.wslconfig` so WSL2 and Windows reach each other on `127.0.0.1`.'
  explanation: 'By default WSL2 sits behind NAT, so from Linux a Windows server is not at `127.0.0.1` but at a host address like `172.30.96.1` that can change after a reboot. Mirrored mode copies the Windows network interfaces into Linux, so `curl http://127.0.0.1:8080` in WSL reaches a Windows service on port 8080. Add `networkingMode=mirrored` under `[wsl2]` in `%UserProfile%\.wslconfig`, then run `wsl --shutdown` (Windows 11 22H2 or later).'
  tags: [windows, networking]
- date: 2026-10-14
  tip: 'setuid and setgid are permission bits that make a program run as the file''s owner or group, not as you.'
  explanation: 'The names are short for "set user ID" and "set group ID" on execution. `ls -l /usr/bin/passwd` shows `-rwsr-xr-x root root`: the `s` in the owner''s execute slot is setuid, so `passwd` runs as root and can update `/etc/shadow`, the password file ordinary users cannot even read. An `s` in the group''s execute slot (`-rwxr-sr-x`) is setgid, which runs the program with the file''s group instead.'
  tags: [linux, security]
- date: 2026-10-15
  tip: 'In WSL2, move projects off the Windows drive into your Linux home: `mv /mnt/c/Users/dave/project ~/`.'
  explanation: 'Your home directory sits on WSL2''s own ext4 disk, while `/mnt/c` reaches Windows through a file-sharing protocol, so commands that touch many small files, like `git status` or `npm install`, run several times slower there. Windows apps can still open the moved files at `\\wsl.localhost\Ubuntu\home\dave\project`.'
  tags: [windows, linux, best-practice]
- date: 2026-10-16
  tip: 'In RAG, reranking is a second pass that re-scores the retrieved chunks with a slower, more accurate model.'
  explanation: 'Retrieval-augmented generation (RAG) answers a question by first pulling a shortlist of text chunks from a vector index, ranked by how close each chunk''s embedding is to the question''s embedding. That search is fast but rough, so a reranker reads the question and each candidate chunk together, gives every pair a relevance score, and reorders the list. Only the top few after reranking are pasted into the LLM''s prompt, so the model sees fewer, better passages.'
  tags: [llm]
- date: 2026-10-17
  tip: 'Rerank with a cross-encoder: it reads the query and chunk together instead of embedding them separately.'
  explanation: 'A bi-encoder, the model behind vector search, turns each chunk into one vector ahead of time, so it never sees the query and the chunk at once. A cross-encoder takes the query and chunk as a single input, so every query word can attend to every chunk word; it is slower but much better at judging whether a chunk actually answers the question. Asked "How tall is Mount Everest?", the bi-encoder `all-MiniLM-L6-v2` ranked a title that only echoed the question ("how tall is it really?") first, while the cross-encoder `ms-marco-MiniLM-L6-v2` put "Everest stands 29,032 feet tall." on top.'
  tags: [llm]
